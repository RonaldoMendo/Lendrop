    const colOf = { S: -0.37, M: 0, L: 0.37 }, seen = { S: 0, M: 0, L: 0 };
    ITEMS.forEach(item => {
      const row = seen[item.size]++;
      const tile = createInteractive(this.catalog.el, T, {
        w: 0.34, h: 0.21, pos: [colOf[item.size], -0.02 - row * 0.235, 0.006], render: drawTile,
        state: { item, rented: false }, onClick: () => this.onSelect(item),
        onHover: on => this.previewComp(on ? item.comp : null)
      });
      this.tiles.push(tile); this.catalog.interactives.push(tile);
    });
    this.catalog.canEnable = i => !(i.state.item && this.rented.has(i.state.item.id));

    // Detalle con duración y desglose de cobro
    this.detail = createPanel(S, T, { w: 1.1, h: 0.86, pos: OFF });
    this.dayChips = DAYS_OPTIONS.map((d, i) => createInteractive(this.detail.el, T, { w: 0.2, h: 0.075, px: 440, pos: [-0.398 + i * 0.22, 0.065, 0.006], render: drawChip, state: { label: d === 1 ? '1 día' : `${d} días` }, onClick: () => this.pickDays(d) }));
    this.detail.interactives.push(...this.dayChips);
    this.backBtn = this.detail.addButton({ label: 'Volver', w: 0.28, x: -0.37, variant: 'ghost', onClick: () => this.onBack() });
    this.payBtn = this.detail.addButton({ label: 'Pagar', w: 0.6, x: 0.18, onClick: () => this.onPay() });

    // Cierre con calificación
    this.final = createPanel(S, T, { w: 1.1, h: 0.84, pos: OFF });
    this.stars = [0, 1, 2, 3, 4].map(i => createInteractive(this.final.el, T, {
      w: 0.08, h: 0.08, px: 160, pos: [-0.44 + i * 0.092, -0.03, 0.006], render: drawStar, state: { on: false },
      onClick: () => this.rate(i + 1), onHover: on => this.previewStars(on ? i + 1 : 0)
    }));
    this.final.interactives.push(...this.stars);
    this.final.addButton({ label: 'Alquilar otro', w: 0.36, x: -0.33, variant: 'ghost', onClick: () => this.onAnother() });
    this.final.addButton({ label: 'Terminar y borrar datos', w: 0.6, x: 0.19, onClick: () => this.onFinish() });

    // Notificaciones tipo "push"
    this.toast = createPanel(S, T, { w: 0.66, h: 0.16, pos: OFF, px: 900 });

    // En el locker: teclado para confirmar identidad e indicador flotante
    this.pinPanel = createPanel(this.lockerEl, T, { w: 0.46, h: 0.66, pos: [-0.66, 1.08, 0.5], rot: [-10, 16, 0], px: 512 });
    this.keypad = createKeyboard(this.pinPanel.el, { layout: KB_NUM, keyW: 0.11, keyH: 0.075, gap: 0.01, pos: [0, -0.135, 0.006], onKey: k => this.onPinKey(k), plate: false });
    this.hint = createPanel(this.lockerEl, T, { w: 0.8, h: 0.15, pos: [0, 1.5, 0.32], rot: [0, 0, 0] });
  },

  buildBeacon() {
    const c = document.createElement('canvas'); c.width = 4; c.height = 128;
    const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 128);
    g.addColorStop(0, 'rgba(165,140,244,0)'); g.addColorStop(0.7, 'rgba(165,140,244,0.35)'); g.addColorStop(1, 'rgba(201,184,255,0.85)');
    x.fillStyle = g; x.fillRect(0, 0, 4, 128);
    this.beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 7, 20, 1, true),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
    this.beacon.visible = false; this.lockerEl.object3D.add(this.beacon);
  },

  bindLocker() {
    Object.values(this.locker.comps).forEach(entry => {
      let lastDoor = 0;
      entry.doorEl.addEventListener('mouseenter', () => { if (this.state === 'ready' && this.selected && this.selected.comp === entry.c.id) entry.mat.emissiveIntensity = 0.35; });
      entry.doorEl.addEventListener('mouseleave', () => { entry.mat.emissiveIntensity = 0; });
      entry.doorEl.addEventListener('click', () => { const n = performance.now(); if (n - lastDoor < 700) return; lastDoor = n; Sound.unlock(); this.onDoor(entry.c.id); });
      if (!entry.model) return;
      entry.modelHome = entry.model.position.clone();
      // Zona invisible para "tomar" el artículo cuando la puerta está abierta
      const proxy = makeEntity(this.lockerEl, { pos: [entry.x, entry.cy, -0.02] });
      proxy.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(LOCKER.colW - 0.03, entry.h - 0.03), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })));
      entry.proxy = proxy;
      let last = 0;
      proxy.addEventListener('click', () => { const n = performance.now(); if (n - last < 700) return; last = n; this.onTake(entry.c.id); });
      proxy.addEventListener('mouseenter', () => { if (this.state === 'takeItem') this.locker.itemGlow.material.opacity = 0.9; });
      proxy.addEventListener('mouseleave', () => { if (this.state === 'takeItem') this.locker.itemGlow.material.opacity = 0.5; });
    });
  },

  /* ---------- Utilidades ---------- */
  wait(ms) { return new Promise(res => this.tween.add(1, () => {}, { delay: ms, onDone: res })); },
  firstName() { return this.profile ? this.profile.name.split(' ')[0] : ''; },
  drawScreen(mode, extra = {}) {
    const time = new Date().toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit' });
    const it = this.selected || {};
    this.locker.screen.draw((c, W, H) => drawTerminal(c, W, H, { mode, time, comp: it.comp || '', code: this.code, name: this.firstName(), ...extra }));
  },
  camPose() {
    const cam = this.el.camera;
    cam.getWorldPosition(this.V1); cam.getWorldDirection(this.V2);
    this.V2.y = 0; if (this.V2.lengthSq() < 1e-4) this.V2.set(0, 0, -1); this.V2.normalize();
    return { p: this.V1, f: this.V2 };
  },
  /** Coloca un elemento frente al usuario, a la altura de sus ojos y mirándolo. */
  targetFor({ dist = 1.45, lateral = 0, height = null, lift = -0.12 } = {}) {
    const { p, f } = this.camPose();
    const x = p.x + f.x * dist - f.z * lateral, z = p.z + f.z * dist + f.x * lateral;
    return { x, z, y: height != null ? height : Math.max(1.15, p.y + lift), yaw: Math.atan2(p.x - x, p.z - z) };
  },
  place(el, opts) { const t = this.targetFor(opts); el.object3D.position.set(t.x, t.y, t.z); el.object3D.rotation.set(0, t.yaw, 0); },
  showFollow(panel, opts = {}) { panel.follow = opts; this.place(panel.el, opts); panel.show(); this.active = panel; },
  hideFollow(panel) { panel.hide(); if (this.active === panel) this.active = null; },
  /** Interfaz "tag-along": si el usuario se aleja, el panel activo lo alcanza suavemente. */
  refollow(force) {
    const a = this.active; if (!a) return;
    if (force) { this.place(a.el, a.follow); return; }
    if (this.following) return;
    this.following = true;
    const o = a.el.object3D, from = o.position.clone(), fy = o.rotation.y, t = this.targetFor(a.follow);
    let dy = t.yaw - fy; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    this.tween.add(500, p => { o.position.set(from.x + (t.x - from.x) * p, from.y + (t.y - from.y) * p, from.z + (t.z - from.z) * p); o.rotation.y = fy + dy * p; },
      { ease: Ease.inOutCubic, onDone: () => (this.following = false) });
  },
  notify(title, text, ms = 5200) {
    this.toast.redraw((c, W, H) => drawToast(c, W, H, { title, text }));
    this.place(this.toast.el, { dist: 1.25, lift: 0.3 });
    this.toast.show(); Sound.notify();
    clearTimeout(this.toastTimer); this.toastTimer = setTimeout(() => this.toast.hide(), ms);
  },
  setGaze(on) {
    this.gaze.setAttribute('raycaster', 'enabled', on);
    this.gaze.object3D.visible = on;
    if (this.gaze.nextElementSibling) this.gaze.nextElementSibling.object3D.visible = on;
  },
  setFuse(ms) { this.gaze.setAttribute('cursor', 'fuseTimeout', ms); this.gaze.setAttribute('animation__fusing', 'dur', ms); },
  setFade(v) { this.fader.material.opacity = v; this.fader.visible = v > 0.001; },

  async teleport(spot) {
    if (this.teleporting) return;
    this.teleporting = true; Sound.whoosh();
    await new Promise(res => this.tween.add(170, p => this.setFade(p), { ease: Ease.linear, onDone: res }));
    const rig = this.rig.object3D;
    rig.position.set(spot.x, 0, spot.z);
    const camYaw = new THREE.Euler().setFromQuaternion(this.camEl.object3D.quaternion, 'YXZ').y;
    rig.rotation.y = Math.atan2(-(spot.look[0] - spot.x), -(spot.look[1] - spot.z)) - camYaw;
    this.refollow(true);
    await this.wait(80);
    await new Promise(res => this.tween.add(280, p => this.setFade(1 - p), { ease: Ease.linear, onDone: res }));
    this.teleporting = false;
  },

  /* ---------- Cuenta y datos personales ---------- */
  onGuest() {
    if (this.state !== 'intro') return;
    this.profile = { ...DEMO_PROFILE, id: lendropId() };
    this.toProfile(this.welcome);
  },
  onRegister() {
    if (this.state !== 'intro') return;
    const run = ++this.run; this.state = 'register';
    this.draft = { name: '', dui: '', zone: null };
    Sound.tap(); this.hideFollow(this.welcome); this.updateRegister();
    this.wait(320).then(() => { if (run === this.run) this.showFollow(this.register, { height: null, lift: 0.04 }); });
  },
  onCancelRegister() {
    if (this.state !== 'register') return;
    const run = ++this.run; this.state = 'intro';
    this.blur(); this.draft = null; Sound.tap(); this.hideFollow(this.register);
    this.wait(320).then(() => { if (run === this.run) this.showFollow(this.welcome); });
  },
  focusField(f) {
    if (this.state !== 'register') return;
    this.focus = f; Sound.tap();
    (f === 'name' ? this.kbNum : this.kbAlpha).hide();
    (f === 'name' ? this.kbAlpha : this.kbNum).show();
    this.rig.components.locomotion.suspendKeys = true; this.rig.components.locomotion.keys = {};
    this.setFuse(850); this.updateRegister();
  },
  blur() {
    this.focus = null; this.kbAlpha.hide(); this.kbNum.hide();
    this.rig.components.locomotion.suspendKeys = false; this.setFuse(1500);
    if (this.draft) this.updateRegister();
  },
  onKey(k) {
    if (!this.focus || !this.draft) return;
    Sound.key();
    const d = this.draft, field = this.focus;
    if (k === 'ok') { this.blur(); return; }
    if (field === 'name') {
      if (k === 'del') d.name = d.name.slice(0, -1);
      else if (k === 'space') { if (d.name && !d.name.endsWith(' ')) d.name += ' '; }
      else if (/^[A-ZÑ]$/.test(k) && d.name.length < 30) d.name += k;
    } else {
      if (k === 'del') d.dui = d.dui.slice(0, -1);
      else if (/^\d$/.test(k) && d.dui.length < 9) d.dui += k;
      if (d.dui.length === 9) this.wait(250).then(() => { if (this.focus === 'dui') this.blur(); });
    }
    this.updateRegister();
  },
  /** Teclado físico (computadora): escribe en el campo activo o en el PIN del locker. */
  onPhysicalKey(e) {
    let k = null;
    if (e.key === 'Backspace') k = 'del';
    else if (e.key === 'Enter') k = 'ok';
    else if (e.key === ' ') k = 'space';
    else if (/^[a-zñA-ZÑ0-9]$/.test(e.key)) k = e.key.toUpperCase();
    if (!k) return;
    if (this.focus) { if (this.focus === 'name' || /\d|del|ok/.test(k)) { e.preventDefault(); this.onKey(k); } }
    else if (this.state === 'authPin' && (/^\d$/.test(k) || k === 'del')) { e.preventDefault(); this.onPinKey(k); }
  },
  pickZone(z) { if (this.state !== 'register') return; Sound.tap(); this.draft.zone = z; this.updateRegister(); },
  registerValid() {
    const d = this.draft;
    return d && d.name.trim().length >= 3 && duiValid(d.dui) && !!d.zone;
  },
  updateRegister() {
    const d = this.draft; if (!d) return;
    const duiState = d.dui.length === 9 ? (duiValid(d.dui) ? 'ok' : 'bad') : d.dui ? 'typing' : 'empty';
    this.register.redraw((c, W, H) => drawRegister(c, W, H, { ...this.reg, duiState }));
    this.nameField.set({ value: titleCase(d.name), focused: this.focus === 'name', ok: d.name.trim().length >= 3 });
    this.duiField.set({ value: formatDui(d.dui), focused: this.focus === 'dui', ok: duiState === 'ok', bad: duiState === 'bad' });
    this.zoneChips.forEach(c => c.set({ selected: c.state.label === d.zone }));
    const ok = this.registerValid();
    this.createBtn.set({ dim: !ok });
    if (this.register.el.object3D.visible) this.createBtn.enable(ok);
  },
  onCreateAccount() {
    if (this.state !== 'register' || !this.registerValid()) return;
    const d = this.draft;
    this.profile = { name: titleCase(d.name.trim()), dui: d.dui, zone: d.zone, guest: false, id: lendropId() };
    this.blur(); this.draft = null;
    this.toProfile(this.register);
  },
  toProfile(fromPanel) {
    const run = ++this.run; this.state = 'profile';
    Sound.success(); this.hideFollow(fromPanel);
    this.profileCard.redraw((c, W, H) => drawProfile(c, W, H, this.profile));
    this.wait(340).then(() => { if (run === this.run) this.showFollow(this.profileCard); });
  },

  /* ---------- Catálogo y reserva ---------- */
  onShowCatalog() {
    if (this.state !== 'profile') return;
    const run = ++this.run; this.state = 'catalog';
    Sound.tap(); this.hideFollow(this.profileCard); this.refreshInventory();
    this.wait(340).then(() => { if (run === this.run) this.showFollow(this.catalog, { lift: -0.08 }); });
  },
  refreshInventory() {
    if (this.rented.size === ITEMS.length) this.rented.clear(); // reabastecimiento automático para la demo
    const counts = { S: 0, M: 0, L: 0 };
    ITEMS.forEach(i => { if (!this.rented.has(i.id)) counts[i.size]++; });
    this.catalog.redraw((c, W, H) => drawCatalog(c, W, H, counts));
    this.tiles.forEach(t => t.set({ rented: this.rented.has(t.state.item.id) }));
    const byComp = Object.fromEntries(ITEMS.map(i => [i.comp, i]));
    Object.values(this.locker.comps).forEach(e => {
      const item = byComp[e.c.id], available = item && !this.rented.has(item.id);
      e.led.material.color.set(available ? BRAND.lavender : '#6b5a9e');
      e.led.material.opacity = available ? 0.95 : 0.3;
      if (e.model) { e.model.visible = !!available; e.model.position.copy(e.modelHome || e.model.position); e.model.scale.setScalar(1); }
    });
  },
  previewComp(compId) {
    if (this.state !== 'catalog') return;
    if (this.preview && this.preview !== compId) {
      const prev = this.locker.comps[this.preview].highlight;
      this.tween.add(200, p => (prev.mat.opacity = Math.min(prev.mat.opacity, 0.6 * (1 - p))));
    }
    this.preview = compId;
    if (compId) { const hl = this.locker.comps[compId].highlight; this.tween.add(200, p => (hl.mat.opacity = 0.6 * p)); }
  },
  clearHighlights() { Object.values(this.locker.comps).forEach(e => e.highlight && (e.highlight.mat.opacity = 0)); this.preview = null; },

  onSelect(item) {
    if (this.state !== 'catalog' || this.rented.has(item.id)) return;
    const run = ++this.run; this.state = 'detail';
    this.selected = item; this.days = 1; this.startTime = performance.now();
    Sound.tap(); this.clearHighlights(); this.hideFollow(this.catalog);
    this.updateDetail();
    this.wait(320).then(() => { if (run === this.run) this.showFollow(this.detail); });
  },
  updateDetail(reserved = false) {
    const item = this.selected, p = pricing(item, this.days);
    this.detail.redraw((c, W, H) => drawProduct(c, W, H, item, { days: this.days, reserved }));
    this.dayChips.forEach((c, i) => c.set({ selected: DAYS_OPTIONS[i] === this.days }));
    if (!reserved) this.payBtn.set({ label: `Pagar ${money(p.total)}`, variant: 'primary' });
  },
  pickDays(d) { if (this.state !== 'detail') return; Sound.tap(); this.days = d; this.updateDetail(); },
  onBack() {
    if (this.state !== 'detail') return;
    const run = ++this.run; this.state = 'catalog'; this.selected = null;
    Sound.tap(); this.hideFollow(this.detail);
    this.wait(320).then(() => { if (run === this.run) this.showFollow(this.catalog, { lift: -0.08 }); });
  },

  async onPay() {
    if (this.state !== 'detail') return;
    const run = ++this.run; this.state = 'paying';
    const item = this.selected;
    this.code = 'LDP-' + Math.floor(1000 + Math.random() * 9000);
    Sound.tap(); this.detail.interactives.forEach(i => i.enable(false));
    this.payBtn.set({ label: 'Procesando pago…', variant: 'busy' });
    await this.wait(1100); if (run !== this.run) return;
    this.updateDetail(true);
    this.payBtn.set({ label: '✓  Pago aprobado', variant: 'done' });
    Sound.confirm();
    await this.wait(1200); if (run !== this.run) return;
    this.hideFollow(this.detail);
    this.notify('Lendrop · Reserva confirmada', `${item.name} te espera en el locker ${item.comp}. Sigue la luz lavanda.`);
    this.goToLocker();
  },
  goToLocker() {
    this.state = 'goToLocker';
    const e = this.locker.comps[this.selected.comp];
    this.beacon.position.set(e.x, 2.36 + 3.5, -0.2); this.beacon.visible = true;
    this.drawScreen('waiting');
    this.showHint(`Ve al locker ${this.selected.comp} · sigue la luz`, e);
  },
  showHint(text, entry) {
    this.hint.redraw((c, W, H) => drawPill(c, W, H, text));
    this.hint.el.object3D.position.set(entry.x, Math.min(entry.y0 + entry.h, 1.88) + 0.1, 0.32);
    this.hint.show();
  },
  /** Llegada al locker: el terminal saluda por nombre y pide confirmar el DUI. */
  arrive() {
    if (this.state !== 'goToLocker') return;
    this.state = 'authPin'; this.pin = ''; this.pinError = false;
    this.hint.hide(); this.drawScreen('hello'); Sound.notify();
    this.drawPin(); this.pinPanel.show(); this.keypad.show(); this.setFuse(850);
  },
  drawPin() {
    const last4 = this.profile.dui.slice(5, 9);
    const hint = this.profile.guest ? `Demo: ${last4.split('').join(' ')}` : '';
    this.pinPanel.redraw((c, W, H) => drawPinPanel(c, W, H, { pin: this.pin, error: this.pinError, hint }));
  },
  onPinKey(k) {
    if (this.state !== 'authPin' || this.pinError) return;
    Sound.key();
    if (k === 'del') this.pin = this.pin.slice(0, -1);
    else if (/^\d$/.test(k) && this.pin.length < 4) this.pin += k;
    this.drawPin();
    if (this.pin.length === 4 && (k !== 'del')) this.wait(250).then(() => this.checkPin());
  },
  async checkPin() {
    if (this.state !== 'authPin' || this.pin.length !== 4) return;
    if (this.pin === this.profile.dui.slice(5, 9)) { this.verify(); return; }
    const run = ++this.run;
    this.pinError = true; this.drawPin(); this.drawScreen('error'); Sound.error();
    const o = this.pinPanel.el.object3D, x0 = o.position.x;
    this.tween.add(420, p => (o.position.x = x0 + Math.sin(p * Math.PI * 6) * 0.015 * (1 - p)), { ease: Ease.linear });
    await this.wait(1000); if (run !== this.run) return;
    this.pin = ''; this.pinError = false; this.drawPin(); this.drawScreen('hello');
  },
  async verify() {
    const run = ++this.run; this.state = 'verifying';
    const L = this.locker, entry = L.comps[this.selected.comp];
    this.keypad.hide(); this.pinPanel.hide(); this.setFuse(1500);
    this.scanning = true; Sound.scan();
    await new Promise(res => this.tween.add(2300, p => this.drawScreen('verify', { progress: p }), { ease: Ease.linear, onDone: res }));
    if (run !== this.run) return;
    this.scanning = false; L.domeRing.material.opacity = 0.6;
    this.drawScreen('verified'); Sound.success();
    await this.wait(700); if (run !== this.run) return;
    this.state = 'ready';
    this.showHint(`Mira o apunta al compartimento ${entry.c.id}`, entry);
    this.tween.add(400, p => (entry.highlight.mat.opacity = p));
    entry.doorEl.classList.add('clickable');
  },

  async onDoor(compId) {
    if (this.state !== 'ready' || !this.selected || this.selected.comp !== compId) return;
    const run = ++this.run; this.state = 'opening';
    const L = this.locker, entry = L.comps[compId];
    entry.doorEl.classList.remove('clickable'); entry.mat.emissiveIntensity = 0;
    this.hint.hide(); this.tween.add(300, p => (entry.highlight.mat.opacity = 1 - p));
    this.tween.add(600, p => (this.beacon.material.opacity = (1 - p) * 0.6), { onDone: () => (this.beacon.visible = false) });
    Sound.door(); this.drawScreen('open');
    entry.led.material.opacity = 1;
    L.cavityLight.position.set(entry.x, entry.y0 + entry.h * 0.75, -0.12);
    L.cavityLight.distance = 1.2 + entry.h * 0.6;
    L.itemGlow.position.set(entry.x, entry.cy, -0.3); L.itemGlow.scale.setScalar(0.5 + entry.h * 0.6);
    L.flash.position.set(entry.x, entry.cy, -0.05);
    this.tween.add(1500, p => entry.pivot.object3D.rotation.set(0, -105 * DEG * p, 0), { ease: Ease.outBack });
    this.tween.add(900, p => { L.cavityLight.intensity = 1.8 * p; L.itemGlow.material.opacity = 0.5 * p; }, { delay: 200 });
    await this.wait(1300); if (run !== this.run) return;
    Sound.shutter();
    this.tween.add(450, p => (L.flash.material.opacity = p < 0.2 ? p * 5 : (1 - p) * 1.25), { ease: Ease.linear });
    this.drawScreen('photo');
    await this.wait(1200); if (run !== this.run) return;
    this.state = 'takeItem';
    this.showHint('Toma tu artículo', entry);
    entry.proxy.classList.add('clickable');
  },

  async onTake(compId) {
    if (this.state !== 'takeItem' || this.selected.comp !== compId) return;
    const run = ++this.run; this.state = 'taking';
    const L = this.locker, entry = L.comps[compId], item = this.selected, model = entry.model;
    entry.proxy.classList.remove('clickable'); this.hint.hide();
    Sound.success();
    // El artículo "vuela" hacia el usuario
    const cam = this.el.camera; cam.getWorldPosition(this.V1);
    const target = this.lockerEl.object3D.worldToLocal(this.V1.clone()); target.y -= 0.35;
    const from = model.position.clone();
    this.tween.add(750, p => { model.position.lerpVectors(from, target, p); model.scale.setScalar(1 - 0.75 * p); }, { ease: Ease.inOutCubic });
    this.tween.add(700, p => { L.cavityLight.intensity = 1.8 * (1 - p); L.itemGlow.material.opacity = 0.5 * (1 - p); });
    await this.wait(760); if (run !== this.run) return;
    model.visible = false; model.position.copy(entry.modelHome); model.scale.setScalar(1);
    this.rented.add(item.id);
    const start = entry.pivot.object3D.rotation.y;
    this.tween.add(900, p => entry.pivot.object3D.rotation.set(0, start * (1 - p), 0), { ease: Ease.inOutCubic });
    await this.wait(900); if (run !== this.run) return;
    Sound.door(); entry.led.material.opacity = 0.3; this.drawScreen('taken');
    this.finish = {
      item, days: this.days, rating: 0,
      secs: Math.max(1, Math.round((performance.now() - this.startTime) / 1000)),
      deposit: pricing(item, this.days).deposit,
      returnDate: new Date(Date.now() + this.days * 864e5).toLocaleDateString('es-SV', { weekday: 'long', day: 'numeric', month: 'long' })
    };
    this.rating = 0; this.previewStars(0);
    this.final.redraw((c, W, H) => drawFinal(c, W, H, this.finish));
    await this.wait(400); if (run !== this.run) return;
    this.state = 'done';
    this.showFollow(this.final);
  },
  rate(n) {
    if (this.state !== 'done') return;
    this.rating = n; this.finish.rating = n; Sound.confirm();
    this.previewStars(0);
    this.final.redraw((c, W, H) => drawFinal(c, W, H, this.finish));
  },
  previewStars(n) { const v = n || this.rating; this.stars.forEach((s, i) => s.set({ on: i < v })); },

  resetLockerScreen() { this.selected = null; this.code = ''; this.drawScreen('idle'); },
  async onAnother() {
    if (this.state !== 'done') return;
    const run = ++this.run; this.state = 'catalog';
    Sound.tap(); this.hideFollow(this.final); this.resetLockerScreen(); this.refreshInventory();
    await this.wait(340); if (run !== this.run) return;
    this.showFollow(this.catalog, { lift: -0.08 });
  },
  /** Cierre de sesión: se borran los datos personales y el inventario vuelve a estar completo. */
  async onFinish() {
    if (this.state !== 'done') return;
    const run = ++this.run; this.state = 'intro';
    this.hideFollow(this.final);
    this.profile = null; this.draft = null; this.finish = null;
    this.rented.clear(); this.resetLockerScreen(); this.refreshInventory();
    this.notify('Lendrop · Sesión cerrada', 'Tus datos se borraron de este dispositivo. ¡Gracias por visitarnos!', 4200);
    await this.wait(1200); if (run !== this.run) return;
    this.showFollow(this.welcome);
  },

  /* ---------- Bucle por cuadro ---------- */
  tick(t, dt) {
    const L = this.locker; if (!L) return;
    const s = t / 1000;
    this.city.update(t, dt);
    const { p } = this.camPose();
    // Anillos de teletransporte: se ocultan bajo los pies y sus etiquetas miran al usuario
    for (const h of this.hotspots) {
      const show = Math.hypot(p.x - h.x, p.z - h.z) > 1.0;
      if (show !== h.shown) { h.shown = show; h.el.object3D.visible = show; h.el.classList.toggle('clickable', show); }
      if (!show) continue;
      h.label.rotation.y = Math.atan2(p.x - h.x, p.z - h.z);
      const guide = h.id === 'locker' && this.state === 'goToLocker';
      h.ring.scale.setScalar((guide ? 1 + 0.2 * Math.sin(s * 5) : 1) * (h.hover ? 1.18 : 1));
    }
    // Llegada al locker reservado
    if (this.state === 'goToLocker' && this.selected) {
      const e = L.comps[this.selected.comp];
      if (Math.hypot(p.x - e.x, p.z - (LOCKER_Z + 0.7)) < 2.3) this.arrive();
    }
    // Panel activo que alcanza al usuario
    if (this.active && !this.following && !this.teleporting) {
      const o = this.active.el.object3D.position;
      if (Math.hypot(p.x - o.x, p.z - o.z) > 3.3) this.refollow(false);
    }
    // Viñeta de confort al caminar
    const loco = this.rig.components.locomotion;
    const want = loco && loco.moving ? (this.el.is('vr-mode') ? 0.75 : 0.3) : 0;
    const vm = this.vignette.material; vm.opacity += (want - vm.opacity) * Math.min(1, (dt || 16) / 120);
    this.vignette.visible = vm.opacity > 0.01;
    // Resaltados del locker: solo se dibujan si son visibles
    Object.values(L.comps).forEach(e => { if (e.highlight) e.highlight.mesh.visible = e.highlight.mat.opacity > 0.01; });
    if (this.beacon.visible && this.state === 'goToLocker' || this.state === 'authPin' || this.state === 'verifying' || this.state === 'ready') {
      if (this.beacon.visible) this.beacon.material.opacity = 0.5 + 0.25 * Math.sin(s * 3);
    }
    if (this.scanning) L.domeRing.material.opacity = 0.5 + 0.5 * Math.sin(s * 10);
    const sel = this.selected && L.comps[this.selected.comp];
    if (this.state === 'ready' && sel) {
      sel.led.material.opacity = 0.55 + 0.45 * Math.sin(s * 5);
      sel.highlight.mat.opacity = 0.65 + 0.35 * Math.sin(s * 3);
    }
    if (this.state === 'catalog' && this.preview) L.comps[this.preview].highlight.mat.opacity = 0.45 + 0.2 * Math.sin(s * 4);
    if ((this.state === 'opening' || this.state === 'takeItem') && sel && sel.model) sel.model.rotation.y = Math.sin(s * 0.9) * 0.18;
  }
});

</script>
