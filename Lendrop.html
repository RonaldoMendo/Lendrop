    <!-- Usuario: el rig se desplaza con el joystick / teclado (componente locomotion) -->
    <a-entity id="rig" position="0 0 1.8" locomotion>
      <a-camera position="0 1.6 0" wasd-controls="enabled: false">
        <!-- Cursor de mirada: mantener la vista sobre un elemento lo activa -->
        <a-entity id="gaze"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.018"
          material="shader: flat; color: #a58cf4; opacity: 0.95; transparent: true"
          cursor="fuse: true; fuseTimeout: 1500"
          raycaster="objects: .clickable; far: 16"
          animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.35 0.35 0.35; dur: 1500; easing: linear"
          animation__reset="property: scale; startEvents: mouseleave, click; to: 1 1 1; dur: 150">
        </a-entity>
        <a-entity position="0 0 -1.001"
          geometry="primitive: ring; radiusInner: 0.019; radiusOuter: 0.022"
          material="shader: flat; color: #ffffff; opacity: 0.35; transparent: true"></a-entity>
      </a-camera>
      <!-- Controles de los lentes (sin modelos externos, para funcionar sin internet) -->
      <a-entity laser-controls="hand: right; model: false" raycaster="objects: .clickable; far: 16; lineColor: #a58cf4; lineOpacity: 0.85"></a-entity>
      <a-entity laser-controls="hand: left; model: false" raycaster="objects: .clickable; far: 16; lineColor: #a58cf4; lineOpacity: 0.85"></a-entity>
    </a-entity>
  </a-scene>

<script>
/* =====================================================================
   LENDROP VR v3 — Plaza Salvador del Mundo, San Salvador
   Estructura:
     1. Marca y utilidades            2. Animaciones (tween)
     3. Sonido sintetizado            4. Dibujo en canvas (UI)
     6–8. Datos, modelos y locker     9. Componentes de interfaz
    11. Colisiones y movimiento      12. Teclado virtual
    13. Ciudad (entorno + vida)      14. Experiencia (máquina de estados)
   Privacidad: los datos personales solo viven en memoria y se borran
   al terminar la sesión. No se envían a ningún servidor.
   ===================================================================== */

/* ---------- 1. Marca y utilidades ---------- */
const BRAND = {
  purple: '#433075', purpleSoft: '#4c3a86', lavender: '#a58cf4', lavenderSoft: '#c9b8ff',
  ink: '#16121f', dark: '#0d0d0d', white: '#ffffff', muted: '#b9b0d6'
};
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const DEG = Math.PI / 180;

const Ease = {
  linear: p => p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  outBack: p => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
};

/** Generador pseudoaleatorio con semilla: la ciudad se ve igual en cada carga. */
function seeded(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Crea una entidad A-Frame con posición/rotación y la agrega al padre. */
function makeEntity(parent, { pos = [0, 0, 0], rot = [0, 0, 0], visible = true } = {}) {
  const el = document.createElement('a-entity');
  el.setAttribute('position', { x: pos[0], y: pos[1], z: pos[2] });
  el.setAttribute('rotation', { x: rot[0], y: rot[1], z: rot[2] });
  el.setAttribute('visible', visible);
  parent.appendChild(el);
  return el;
}

/* ---------- 2. Tweens (usa el tick de A-Frame: funciona dentro de la sesión VR) ---------- */
AFRAME.registerSystem('tween', {
  init() { this.items = []; },
  add(dur, onUpdate, { ease = Ease.outCubic, delay = 0, onDone } = {}) {
    const item = { t: -delay, dur: Math.max(dur, 1), onUpdate, ease, onDone, cancelled: false };
    this.items.push(item);
    return item;
  },
  tick(t, dt) {
    if (!this.items.length) return;
    const step = Math.min(dt, 50), list = this.items, done = [];
    this.items = [];
    for (const it of list) {
      if (it.cancelled) continue;
      it.t += step;
      if (it.t < 0) { this.items.push(it); continue; }
      const p = Math.min(it.t / it.dur, 1);
      it.onUpdate(it.ease(p));
      if (p < 1) this.items.push(it); else if (it.onDone) done.push(it.onDone);
    }
    done.forEach(fn => fn());
  }
});


/* ---------- 3. Sonido sintetizado con Web Audio (sin archivos externos) ---------- */
const Sound = (() => {
  let ctx = null, ambienceOn = false;
  function ac() {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    if (!ctx) ctx = new C();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, { type = 'sine', gain = 0.12 } = {}) {
    const c = ac(); if (!c) return;
    const t0 = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(start, dur, { from = 400, to = 1800, gain = 0.1, q = 0.8, attack = 0.04 } = {}) {
    const c = ac(); if (!c) return;
    const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t0 = c.currentTime + start;
    src.buffer = buf; f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur * 0.8);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t0);
  }
  /** Ambiente de ciudad: rumor grave de tráfico + autos que pasan cada pocos segundos. */
  function ambience() {
    const c = ac(); if (!c || ambienceOn) return;
    ambienceOn = true;
    const len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; src.loop = true; f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = 0.06;
    src.connect(f).connect(g).connect(c.destination); src.start();
    const pass = () => { noise(0, 2.4, { from: 160, to: 650, gain: 0.03, q: 0.6, attack: 0.9 }); setTimeout(pass, 4500 + Math.random() * 7000); };
    setTimeout(pass, 2500);
  }
  return {
    unlock: () => ac(), ambience,
    tap: () => tone(1046, 0, 0.09, { gain: 0.07 }),
    key: () => tone(1318, 0, 0.05, { gain: 0.045 }),
    confirm: () => { tone(784, 0, 0.14); tone(1175, 0.1, 0.22); },
    notify: () => { tone(988, 0, 0.12, { gain: 0.07 }); tone(1319, 0.13, 0.2, { gain: 0.07 }); },
    error: () => { tone(220, 0, 0.16, { type: 'square', gain: 0.045 }); tone(175, 0.15, 0.22, { type: 'square', gain: 0.045 }); },
    scan: () => { tone(330, 0, 1.8, { type: 'triangle', gain: 0.03 }); tone(495, 0.4, 1.4, { type: 'sine', gain: 0.02 }); },
    success: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.085, 0.4, { gain: 0.08 })),
    whoosh: () => noise(0, 0.45, { from: 300, to: 1200, gain: 0.07 }),
    door: () => { tone(196, 0, 0.06, { type: 'square', gain: 0.05 }); tone(294, 0.07, 0.06, { type: 'square', gain: 0.04 }); noise(0.12, 0.9); },
    shutter: () => { noise(0, 0.06, { from: 3000, to: 5000, gain: 0.12, q: 2 }); noise(0.08, 0.05, { from: 2500, to: 4000, gain: 0.08, q: 2 }); }
  };
})();

/* ---------- 4b. Utilidades de texto y datos ---------- */
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fitFont(ctx, text, weight, size, maxW, min = 16, family = FONT) {
  let s = size;
  do { ctx.font = `${weight} ${s}px ${family}`; } while (ctx.measureText(text).width > maxW && --s > min);
  return s;
}
const titleCase = s => s.toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());
const money = n => '$' + n.toFixed(2);

/* ---------- 4c. Dibujo de las pantallas de la app ---------- */
function drawWelcome(ctx, W, H) {
  drawCardBase(ctx, W, H);
  drawWordmark(ctx, 60, 50, 66);
  ctx.textAlign = 'right'; ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `500 24px ${FONT}`;
  ctx.fillText('San Salvador', W - 64, 96); ctx.textAlign = 'left';
  ctx.font = `700 58px ${FONT}`; ctx.fillStyle = BRAND.white;
  ctx.fillText('Alquila lo que necesitas,', 64, 206); ctx.fillText('a pocos pasos de ti.', 64, 274);
  ctx.font = `400 30px ${FONT}`; ctx.fillStyle = BRAND.muted;
  wrapText(ctx, 'Sin encuentros con desconocidos ni horarios que coordinar: reservas, pagas y retiras en un locker inteligente.', 64, 336, W - 128, 41);
  ctx.font = `500 23px ${FONT}`; ctx.fillStyle = 'rgba(201,184,255,0.85)';
  ctx.fillText('Camina con el joystick · Elige mirando o apuntando', 64, 500);
}

/** Etiquetas y textos fijos del formulario de registro (los campos son interactivos aparte). */
function drawRegister(ctx, W, H, st) {
  drawCardBase(ctx, W, H);
  const k = W / st.w, Y = m => (st.h / 2 - m) * k;
  ctx.fillStyle = BRAND.white; ctx.font = `700 46px ${FONT}`; ctx.fillText('Crea tu cuenta', 52, Y(0.372));
  drawWordmark(ctx, W - 52, Y(0.372) - 46, 50, null, 'right');
  ctx.fillStyle = BRAND.muted; ctx.font = `400 25px ${FONT}`; ctx.fillText('Toca un campo para escribir con el teclado virtual.', 52, Y(0.325));
  ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `600 25px ${FONT}`;
  ctx.fillText('Nombre completo', 52, Y(0.268));
  ctx.fillText('DUI', 52, Y(0.128));
  ctx.fillText('Zona donde retiras', 52, Y(-0.012));
  // Estado del DUI, a la derecha del campo
  const msg = { ok: ['✓ DUI válido', BRAND.lavender], bad: ['DUI inválido: revisa el último dígito', '#ff8fa3'] }[st.duiState] || ['Formato 00000000-0', 'rgba(185,176,214,0.75)'];
  ctx.fillStyle = msg[1]; ctx.font = `500 23px ${FONT}`; ctx.fillText(msg[0], (st.w / 2 + 0.0) * k, Y(0.062));
  // Nota de privacidad con candado
  const ly = Y(-0.168), lx = 52;
  ctx.strokeStyle = BRAND.lavender; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(lx + 11, ly - 18, 7, Math.PI, 0); ctx.stroke();
  roundRect(ctx, lx, ly - 16, 22, 17, 4); ctx.fillStyle = BRAND.lavender; ctx.fill();
  ctx.fillStyle = BRAND.muted; ctx.font = `400 23px ${FONT}`;
  ctx.fillText('Tus datos no salen de estos lentes y se borran al terminar.', lx + 36, ly);
}

function drawField(ctx, W, H, st) {
  roundRect(ctx, 3, 3, W - 6, H - 6, Math.min(20, H * 0.3));
  ctx.fillStyle = st.focused ? 'rgba(165,140,244,0.14)' : st.hover ? 'rgba(255,255,255,0.09)' : 'rgba(255,255,255,0.05)'; ctx.fill();
  ctx.lineWidth = st.focused ? 5 : 3;
  ctx.strokeStyle = st.focused ? BRAND.lavender : st.bad ? '#ff8fa3' : 'rgba(165,140,244,0.32)'; ctx.stroke();
  const fs = Math.round(H * 0.42), text = st.value || st.placeholder;
  ctx.textBaseline = 'middle';
  ctx.font = `${st.value ? 600 : 400} ${fs}px ${st.mono ? MONO : FONT}`;
  ctx.fillStyle = st.value ? BRAND.white : 'rgba(185,176,214,0.5)';
  ctx.fillText(text, H * 0.32, H / 2 + 2);
  if (st.focused) {
    const x = H * 0.32 + (st.value ? ctx.measureText(st.value).width + 6 : 0);
    ctx.fillStyle = BRAND.lavender; ctx.fillRect(x, H * 0.24, 4, H * 0.52);
  }
  if (st.ok) {
    const r = H * 0.22, cx = W - H * 0.45, cy = H / 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = BRAND.lavender; ctx.fill();
    drawCheck(ctx, cx, cy, r, BRAND.ink, Math.max(3, r * 0.22));
  }
  ctx.textBaseline = 'alphabetic';
}

function drawChip(ctx, W, H, st) {
  roundRect(ctx, 3, 3, W - 6, H - 6, (H - 6) / 2);
  if (st.selected) { ctx.fillStyle = BRAND.lavender; ctx.fill(); }
  else {
    ctx.fillStyle = st.hover ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.04)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(165,140,244,0.5)'; ctx.stroke();
  }
  ctx.fillStyle = st.selected ? BRAND.ink : BRAND.white;
  fitFont(ctx, st.label, 600, Math.round(H * 0.42), W - 36, 14);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(st.label, W / 2, H / 2 + 2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

/** Tarjeta de perfil: marco "compartimento de locker" para el avatar + ID Lendrop. */
function drawProfile(ctx, W, H, p) {
  drawCardBase(ctx, W, H);
  const ax = 56, ay = 56, as = 150;
  const g = ctx.createLinearGradient(ax, ay, ax + as, ay + as); g.addColorStop(0, BRAND.purpleSoft); g.addColorStop(1, '#221840');
  roundRect(ctx, ax, ay, as, as, 26); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = BRAND.lavender; ctx.stroke();
  roundRect(ctx, ax + 12, ay + 12, as - 24, as - 24, 16); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(201,184,255,0.35)'; ctx.stroke();
  const initials = p.name.split(' ').filter(Boolean).slice(0, 2).map(s => s[0]).join('').toUpperCase();
  ctx.fillStyle = BRAND.white; ctx.font = `700 58px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(initials, ax + as / 2, ay + as / 2 + 3); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.beginPath(); ctx.arc(ax + as - 22, ay + 22, 9, 0, Math.PI * 2); ctx.fillStyle = BRAND.lavender; ctx.fill();

  const x = 240;
  drawWordmark(ctx, W - 48, 44, 40, null, 'right');
  ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `500 25px ${FONT}`; ctx.fillText(p.guest ? 'Modo invitado · datos de demostración' : 'Bienvenido a Lendrop', x, 92);
  ctx.fillStyle = BRAND.white; fitFont(ctx, p.name, 700, 50, W - x - 48, 30); ctx.fillText(p.name, x, 148);
  let bx = x;
  for (const [label, strong] of [['Identidad verificada', true], ['Nuevo en Lendrop', false]]) {
    ctx.font = `600 22px ${FONT}`;
    const w = ctx.measureText(label).width + 32;
    roundRect(ctx, bx, 172, w, 40, 20);
    ctx.fillStyle = strong ? 'rgba(165,140,244,0.22)' : 'rgba(255,255,255,0.06)'; ctx.fill();
    ctx.fillStyle = strong ? BRAND.lavenderSoft : BRAND.muted; ctx.fillText(label, bx + 16, 199); bx += w + 10;
  }
  ctx.fillStyle = BRAND.muted; ctx.font = `500 23px ${FONT}`; ctx.fillText('Tu ID Lendrop', 56, 282);
  ctx.fillStyle = BRAND.white; ctx.font = `700 58px ${MONO}`; ctx.fillText(p.id, 56, 346);
  ctx.fillStyle = 'rgba(185,176,214,0.8)'; ctx.font = `400 22px ${FONT}`; ctx.fillText('Lo usas para abrir cualquier locker', 56, 386);
  ctx.fillText('de la red, junto con tu DUI.', 56, 414);
  const rx = 600;
  ctx.fillStyle = BRAND.muted; ctx.font = `500 23px ${FONT}`; ctx.fillText('DUI', rx, 282);
  ctx.fillStyle = BRAND.white; ctx.font = `600 34px ${MONO}`; ctx.fillText(maskDui(p.dui), rx, 326);
  ctx.fillStyle = BRAND.muted; ctx.font = `500 23px ${FONT}`; ctx.fillText('Zona', rx, 376);
  ctx.fillStyle = BRAND.white; ctx.font = `600 30px ${FONT}`; ctx.fillText(p.zone, rx, 416);
}

function drawProduct(ctx, W, H, item, { days = 1, reserved = false } = {}) {
  drawCardBase(ctx, W, H);
  drawItemIcon(ctx, 48, 48, 200, item.icon);
  if (reserved) {
    roundRect(ctx, 62, 62, 132, 42, 21); ctx.fillStyle = BRAND.lavender; ctx.fill();
    ctx.fillStyle = BRAND.ink; ctx.font = `700 22px ${FONT}`; ctx.fillText('Pagado', 92, 90);
  }
  const x = 284, maxW = W - x - 48;
  ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `500 24px ${FONT}`;
  ctx.fillText(`Locker ${item.comp} · ${SIZES[item.size].label} · Salvador del Mundo`, x, 84);
  ctx.fillStyle = BRAND.white; fitFont(ctx, item.name, 700, 46, maxW, 30); ctx.fillText(item.name, x, 138);
  ctx.fillStyle = BRAND.muted; ctx.font = `400 25px ${FONT}`;
  ctx.fillText(`★ ${item.rating} · ${item.reviews} reseñas · Propietario: ${item.owner}`, x, 180);
  ctx.fillStyle = BRAND.white; ctx.font = `700 54px ${FONT}`; ctx.fillText(`$${item.price}`, x, 244);
  const pw = ctx.measureText(`$${item.price}`).width;
  ctx.fillStyle = BRAND.muted; ctx.font = `400 28px ${FONT}`; ctx.fillText('/ día', x + pw + 10, 244);
  ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `600 25px ${FONT}`; ctx.fillText('¿Por cuánto tiempo?', 48, 292);
  const p = pricing(item, days);
  const row = (label, val, y, o = {}) => {

  };
  row(`Alquiler (${days} ${days === 1 ? 'día' : 'días'})`, money(p.rent), 424);
  row('Tarifa de servicio', money(p.fee), 464);
  row('Garantía (reembolsable)', money(p.deposit), 504);
  ctx.font = `400 21px ${FONT}`; ctx.fillStyle = 'rgba(185,176,214,0.7)';
  ctx.fillText('La garantía se libera cuando la IA confirma la devolución en buen estado.', 48, 536);
  ctx.fillStyle = 'rgba(165,140,244,0.25)'; ctx.fillRect(48, 558, W - 96, 2);
  row('Total hoy', money(p.total), 604, { bold: true, size: 34 });
}

function drawFinal(ctx, W, H, f) {
  drawCardBase(ctx, W, H);
  ctx.beginPath(); ctx.arc(92, 100, 40, 0, Math.PI * 2); ctx.fillStyle = BRAND.lavender; ctx.fill();
  drawCheck(ctx, 92, 100, 40, BRAND.ink, 9);
  const title = `Alquilado en ${f.secs} segundos.`;
  ctx.fillStyle = BRAND.white; fitFont(ctx, title, 700, 52, W - 200, 30); ctx.fillText(title, 152, 118);
  ctx.fillStyle = BRAND.muted; ctx.font = `400 28px ${FONT}`;
  ctx.fillText(`${f.item.name} · retirado del locker ${f.item.comp}`, 64, 184);
  const rows = [`Devuélvelo el ${f.returnDate} en cualquier Lendrop Point`, `Tu garantía de ${money(f.deposit)} se libera al devolverlo`];
  rows.forEach((r, i) => {
    const y = 246 + i * 46;
    ctx.beginPath(); ctx.arc(74, y - 9, 7, 0, Math.PI * 2); ctx.fillStyle = BRAND.lavender; ctx.fill();
    ctx.fillStyle = BRAND.white; fitFont(ctx, r, 500, 27, W - 150, 18); ctx.fillText(r, 96, y);
  });
  ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `600 27px ${FONT}`;
  ctx.fillText(`¿Cómo fue tu experiencia con ${f.item.owner}?`, 64, 368);
  if (f.rating) { ctx.fillStyle = BRAND.muted; ctx.font = `500 24px ${FONT}`; ctx.fillText('¡Gracias por calificar!', 530, 434); }
}

function drawStar(ctx, W, H, st) {
  const cx = W / 2, cy = H / 2 + 4, R = W * 0.42, r = R * 0.45;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath();
  if (st.on) { ctx.fillStyle = BRAND.lavender; ctx.fill(); }
  else { ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = st.hover ? BRAND.lavenderSoft : 'rgba(165,140,244,0.55)'; ctx.stroke(); }
}

function drawToast(ctx, W, H, { title, text }) {
  roundRect(ctx, 4, 4, W - 8, H - 8, 32);
  ctx.fillStyle = 'rgba(24, 19, 36, 0.97)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(165,140,244,0.55)'; ctx.stroke();
  drawLogo(ctx, 30, H / 2 - 42, 84);
  ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `600 26px ${FONT}`; ctx.fillText(title.replace(/^Lendrop · /, ''), 140, 62);
  ctx.textAlign = 'right'; ctx.fillStyle = BRAND.muted; ctx.font = `400 22px ${FONT}`; ctx.fillText('ahora', W - 36, 62); ctx.textAlign = 'left';
  ctx.fillStyle = BRAND.white; ctx.font = `500 29px ${FONT}`;
  wrapText(ctx, text, 140, 108, W - 176, 38);
}

function drawPinPanel(ctx, W, H, { pin = '', error = false, hint = '' }) {
  drawCardBase(ctx, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = BRAND.white; ctx.font = `700 34px ${FONT}`; ctx.fillText('Confirma que eres tú', W / 2, 72);
  ctx.fillStyle = BRAND.muted; ctx.font = `400 22px ${FONT}`; ctx.fillText('4 últimos dígitos de tu DUI', W / 2, 108);
  const bw = 64, gap = 16, x0 = (W - (4 * bw + 3 * gap)) / 2;
  for (let i = 0; i < 4; i++) {
    const x = x0 + i * (bw + gap);
    roundRect(ctx, x, 134, bw, 76, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = error ? '#ff8fa3' : i === pin.length ? BRAND.lavender : 'rgba(165,140,244,0.3)'; ctx.stroke();
    if (i < pin.length) { ctx.beginPath(); ctx.arc(x + bw / 2, 172, 10, 0, Math.PI * 2); ctx.fillStyle = BRAND.white; ctx.fill(); }
  }
  if (error) { ctx.fillStyle = '#ff8fa3'; ctx.font = `600 22px ${FONT}`; ctx.fillText('No coincide. Inténtalo de nuevo.', W / 2, 252); }
  else if (hint) { ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `500 21px ${FONT}`; ctx.fillText(hint, W / 2, 252); }
  ctx.textAlign = 'left';
}

/** Pantalla del locker: cambia según el paso de la experiencia. */
function drawTerminal(ctx, W, H, o = {}) {
  const { mode = 'idle', progress = 0, time = '', comp = '', code = '', name = '' } = o;
  ctx.fillStyle = '#0e0b17'; ctx.fillRect(0, 0, W, H);
  drawWordmark(ctx, 32, 24, 30); ctx.font = `600 20px ${FONT}`; ctx.fillStyle = BRAND.lavender; ctx.fillText('Point', 152, 46);
  ctx.textAlign = 'right'; ctx.fillStyle = BRAND.muted; ctx.font = `400 22px ${FONT}`; ctx.fillText('Salvador del Mundo', W - 32, 46); ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(165, 140, 244, 0.2)'; ctx.fillRect(32, 64, W - 64, 2);
  ctx.textAlign = 'center';
  const cx = W / 2;
  const big = (t, y, f = 42) => { ctx.fillStyle = BRAND.white; fitFont(ctx, t, 700, f, W - 64, 20); ctx.fillText(t, cx, y); };
  const sub = (t, y, c = BRAND.muted, f = 24) => { ctx.fillStyle = c; fitFont(ctx, t, 400, f, W - 56, 14); ctx.fillText(t, cx, y); };
  const badge = (y, color, mark) => {
    ctx.beginPath(); ctx.arc(cx, y, 62, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
    if (mark === 'check') drawCheck(ctx, cx, y, 62, BRAND.ink, 12);
    else { ctx.strokeStyle = BRAND.ink; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx - 24, y - 24); ctx.lineTo(cx + 24, y + 24); ctx.moveTo(cx + 24, y - 24); ctx.lineTo(cx - 24, y + 24); ctx.stroke(); }
  };
  if (mode === 'idle') {
    drawWordmark(ctx, cx, 120, 82, null, 'center'); ctx.textAlign = 'center'; big('Bienvenido', 280, 46); sub('Reserva desde la app para usar este locker', 326);
  } else if (mode === 'waiting') {
    drawWordmark(ctx, cx, 112, 76, null, 'center'); ctx.textAlign = 'center'; big(`Reserva ${code} lista`, 268, 40); sub(`Compartimento ${comp} · acércate para identificarte`, 316, BRAND.muted, 22);
  } else if (mode === 'hello') {
    big(`Hola, ${name}`, 170, 52); sub('Confirma tu identidad en el teclado:', 232); sub('4 últimos dígitos de tu DUI', 270, BRAND.lavenderSoft, 26);
    sub(`Reserva ${code} · ${comp}`, 350, BRAND.muted, 21);
  } else if (mode === 'error') {
    badge(162, '#ff6b81', 'x'); big('Los dígitos no coinciden', 292, 36); sub('Inténtalo de nuevo', 336);
  } else if (mode === 'verify') {
    const s = 150, x0 = cx - s / 2, y0 = 100;
    ctx.strokeStyle = BRAND.lavender; ctx.lineWidth = 6; ctx.lineCap = 'round';
    [[x0, y0, 1, 1], [x0 + s, y0, -1, 1], [x0, y0 + s, 1, -1], [x0 + s, y0 + s, -1, -1]].forEach(([x, y, dx, dy]) => {
      ctx.beginPath(); ctx.moveTo(x, y + dy * 34); ctx.lineTo(x, y); ctx.lineTo(x + dx * 34, y); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(201, 184, 255, 0.45)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, y0 + 62, 30, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, y0 + 150, 52, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    const sy = y0 + 10 + (s - 20) * (0.5 - 0.5 * Math.cos(progress * Math.PI * 4));
    ctx.fillStyle = 'rgba(165, 140, 244, 0.85)'; ctx.fillRect(x0 + 8, sy, s - 16, 4);
    big('Verificando identidad…', 318, 34);
    roundRect(ctx, 80, 350, W - 160, 12, 6); ctx.fillStyle = 'rgba(165, 140, 244, 0.18)'; ctx.fill();
    roundRect(ctx, 80, 350, Math.max(12, (W - 160) * progress), 12, 6); ctx.fillStyle = BRAND.lavender; ctx.fill();
    sub('Reconocimiento facial con IA', 404, BRAND.muted, 22);
  } else if (mode === 'verified') {
    badge(170, BRAND.lavender, 'check'); big('Identidad verificada', 300, 40); sub(`${name} · ${code} · ${comp}`, 344, BRAND.muted, 23);
  } else if (mode === 'open') {
    big(`${comp} abierto`, 220, 60); sub('Retira tu artículo', 268, BRAND.muted, 26);
  } else if (mode === 'photo') {
    drawItemIcon(ctx, cx - 50, 104, 100, 'camera'); big('Evidencia registrada', 272, 38);
    sub(`Foto del estado del artículo · ${time}`, 314, BRAND.muted, 23); sub('Toma tu artículo', 356, BRAND.lavenderSoft, 24);
  } else if (mode === 'taken') {
    badge(170, BRAND.lavender, 'check'); big(`¡Disfrútalo, ${name}!`, 300, 40); sub('Compartimento cerrado y registrado', 344, BRAND.muted, 23);
  }
  ctx.textAlign = 'left';
}

/* ---------- 4. Dibujo en canvas ---------- */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function setSpacing(ctx, px) { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; }
function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' '); let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line = w; y += lineH; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
  return y + lineH;
}
function drawCheck(ctx, cx, cy, r, color, lineW) {
  ctx.strokeStyle = color; ctx.lineWidth = lineW; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx - r * 0.45, cy + r * 0.02); ctx.lineTo(cx - r * 0.1, cy + r * 0.36); ctx.lineTo(cx + r * 0.5, cy - r * 0.32); ctx.stroke();
}

/** Plano con textura de canvas que se puede redibujar. */
function createCanvasPlane(widthM, heightM, px = 1024, { basic = true } = {}) {
  const pw = px, ph = Math.round(px * heightM / widthM);
  const canvas = document.createElement('canvas'); canvas.width = pw; canvas.height = ph;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(widthM, heightM), mat);
  return {
    mesh, mat, ctx, pw, ph,
    draw(fn) { ctx.clearRect(0, 0, pw, ph); fn(ctx, pw, ph); tex.needsUpdate = true; }
  };
}

/** Fondo común de las tarjetas flotantes (estilo vidrio oscuro). */
function drawCardBase(ctx, W, H) {
  roundRect(ctx, 4, 4, W - 8, H - 8, 44);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(36, 28, 62, 0.96)'); g.addColorStop(1, 'rgba(18, 14, 28, 0.96)');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(165, 140, 244, 0.45)'; ctx.stroke();
}

  const line = pts => { ctx.beginPath(); pts.forEach(([a, b], i) => (i ? ctx.lineTo(...P(a, b)) : ctx.moveTo(...P(a, b)))); };
  if (kind === 'camera') {
    roundRect(ctx, s * 0.16, s * 0.34, s * 0.68, s * 0.44, s * 0.06); ctx.stroke();
    roundRect(ctx, s * 0.36, s * 0.24, s * 0.22, s * 0.12, s * 0.03); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.5, s * 0.56, s * 0.13, 0, Math.PI * 2); ctx.stroke();
  } else if (kind === 'drone') {
    roundRect(ctx, s * 0.4, s * 0.43, s * 0.2, s * 0.14, s * 0.04); ctx.stroke();
    [[0.24, 0.3], [0.76, 0.3], [0.24, 0.7], [0.76, 0.7]].forEach(([a, b]) => {
      line([[0.5, 0.5], [a, b]]); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(a * s, b * s, s * 0.13, s * 0.045, 0, 0, Math.PI * 2); ctx.stroke();
    });
  } else if (kind === 'tent') {
    line([[0.16, 0.74], [0.5, 0.24], [0.84, 0.74]]); ctx.closePath(); ctx.stroke();
    line([[0.42, 0.74], [0.5, 0.5], [0.58, 0.74]]); ctx.stroke();
    line([[0.1, 0.74], [0.9, 0.74]]); ctx.stroke();
  } else if (kind === 'drill') {
    roundRect(ctx, s * 0.24, s * 0.3, s * 0.44, s * 0.16, s * 0.05); ctx.stroke();
    ctx.strokeRect(s * 0.68, s * 0.34, s * 0.08, s * 0.08);
    line([[0.76, 0.38], [0.88, 0.38]]); ctx.stroke();
    line([[0.34, 0.46], [0.46, 0.46], [0.44, 0.66], [0.32, 0.66]]); ctx.closePath(); ctx.stroke();
    roundRect(ctx, s * 0.26, s * 0.66, s * 0.26, s * 0.1, s * 0.03); ctx.stroke();
  } else if (kind === 'dress') {
    ctx.beginPath(); ctx.arc(s * 0.5, s * 0.15, s * 0.04, Math.PI, Math.PI * 2.5); ctx.stroke();
    line([[0.5, 0.2], [0.3, 0.3], [0.7, 0.3]]); ctx.closePath(); ctx.stroke();
    line([[0.42, 0.3], [0.58, 0.3], [0.56, 0.46], [0.74, 0.86], [0.26, 0.86], [0.44, 0.46]]); ctx.closePath(); ctx.stroke();
    line([[0.44, 0.46], [0.56, 0.46]]); ctx.stroke();
  } else if (kind === 'guitar') {
    ctx.beginPath(); ctx.arc(s * 0.5, s * 0.68, s * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.5, s * 0.46, s * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(s * 0.475, s * 0.12, s * 0.05, s * 0.3);
    roundRect(ctx, s * 0.45, s * 0.07, s * 0.1, s * 0.09, s * 0.02); ctx.fill();
    ctx.fillStyle = '#2f2358'; ctx.beginPath(); ctx.arc(s * 0.5, s * 0.58, s * 0.045, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/** Textura radial para brillos (faroles, luna, piso bajo el locker). */
function radialTexture(color, size = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'), g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
function glowSprite(color, scale, opacity = 1) {
  const mat = new THREE.SpriteMaterial({ map: radialTexture(color), transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending });
  const s = new THREE.Sprite(mat); s.scale.setScalar(scale); return s;
}

/* ---------- 8. Locker inteligente con módulos de varios tamaños ---------- */
function buildLocker(lockerEl) {
  const g = new THREE.Group(), L = LOCKER;
  const W = L.cols * L.colW, bodyTop = L.base + 4 * L.rowH;
  const bodyMat = std(BRAND.purple, 0.45, 0.3), frameMat = std('#2b1f4f', 0.5, 0.3);
  const doorMat = std(BRAND.purpleSoft, 0.35, 0.35), handleMat = std('#d9d2f2', 0.25, 0.8);
  const ledMat = new THREE.MeshBasicMaterial({ color: BRAND.lavender });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };

  // Carcasa, LEDs y rótulo
  add(new THREE.PlaneGeometry(W, 4 * L.rowH), new THREE.MeshBasicMaterial({ color: '#0b0912' }), 0, L.base + 2 * L.rowH, -L.depth);
  add(new THREE.BoxGeometry(0.06, bodyTop + L.header, 0.5), frameMat, -W / 2 - 0.03, (bodyTop + L.header) / 2, -0.22);
  add(new THREE.BoxGeometry(0.06, bodyTop + L.header, 0.5), frameMat, W / 2 + 0.03, (bodyTop + L.header) / 2, -0.22);
  add(new THREE.BoxGeometry(W + 0.12, L.base, 0.5), std('#1a1428', 0.7, 0), 0, L.base / 2, -0.22);
  add(new THREE.BoxGeometry(W + 0.12, L.header, 0.5), bodyMat, 0, bodyTop + L.header / 2, -0.22);
  add(new THREE.BoxGeometry(W + 0.12, 0.014, 0.014), ledMat, 0, bodyTop + 0.004, 0.035);
  add(new THREE.BoxGeometry(W + 0.12, 0.014, 0.014), ledMat, 0, L.base - 0.004, 0.035);
  const sign = createCanvasPlane(W, L.header * 0.8, 1400);
  sign.draw((ctx, w, h) => {
    drawWordmark(ctx, 44, h / 2 - 50, 100, BRAND.white);
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'right'; ctx.fillStyle = BRAND.lavenderSoft; ctx.font = `500 40px ${FONT}`;
    ctx.fillText('Smart Lockers · Salvador del Mundo', w - 48, h / 2 + 2);
  });
  sign.mesh.position.set(0, bodyTop + L.header / 2, 0.032); g.add(sign.mesh);

  // Terminal con pantalla y cámara de verificación
  const tx = colX(L.terminalCol), tBottom = L.base + 2 * L.rowH;
  add(new THREE.BoxGeometry(L.colW - 0.014, 2 * L.rowH - 0.014, 0.03), std('#120e1c', 0.25, 0.4), tx, tBottom + L.rowH, 0.015);
  const screen = createCanvasPlane(0.44, 0.33, 640);
  screen.mat.transparent = false; screen.mat.depthWrite = true;
  screen.mesh.position.set(tx, tBottom + 0.36, 0.032); g.add(screen.mesh);
  const domeRing = add(new THREE.TorusGeometry(0.034, 0.006, 8, 32), new THREE.MeshBasicMaterial({ color: BRAND.lavender, transparent: true, opacity: 0.6 }), tx, tBottom + 0.7, 0.034);
  add(new THREE.SphereGeometry(0.022, 16, 12), std('#050308', 0.1, 0.9), tx, tBottom + 0.7, 0.03);

  // Compartimentos: puerta (entidad interactiva), cavidad y artículo
  const dw = L.colW - 0.014;
  const innerMat = std('#1c1530', 0.8, 0);
  const handleS = new THREE.BoxGeometry(0.014, 0.12, 0.018), handleL = new THREE.BoxGeometry(0.014, 0.3, 0.018);
  const dotGeo = new THREE.CircleGeometry(0.011, 16);
  const comps = {};
  const itemByComp = Object.fromEntries(ITEMS.map(i => [i.comp, i]));

  for (const c of COMPARTMENTS) {
    const { x, y0, h, cy } = compGeom(c), dh = h - 0.014;
    const pivot = makeEntity(lockerEl, { pos: [x - dw / 2, cy, 0.0125] });
    const doorEl = makeEntity(pivot, { pos: [dw / 2, 0, 0] });
    const mat = doorMat.clone(); mat.emissive = new THREE.Color(BRAND.lavender); mat.emissiveIntensity = 0;
    const door = new THREE.Group();
    door.add(new THREE.Mesh(new THREE.BoxGeometry(dw, dh, 0.025), mat));
    const hy = c.span === 4 ? 1.15 - cy : 0;
    const hd = new THREE.Mesh(c.span > 1 ? handleL : handleS, handleMat); hd.position.set(dw / 2 - 0.05, hy, 0.022); door.add(hd);
    const led = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: BRAND.lavender, transparent: true, opacity: 0.5 }));
    led.position.set(dw / 2 - 0.035, dh / 2 - 0.035, 0.0135); door.add(led);

      hl.mat.blending = THREE.AdditiveBlending; hl.mat.opacity = 0;

    }

  const cavityLight = new THREE.PointLight(BRAND.lavenderSoft, 0, 1.6, 1); g.add(cavityLight);
  const itemGlow = glowSprite('rgba(165,140,244,0.9)', 0.6, 0); g.add(itemGlow);

  floorGlow.rotation.x = -Math.PI / 2; floorGlow.position.set(0, 0.006, 0.5); g.add(floorGlow);
  const keyLight = new THREE.PointLight(BRAND.lavender, 4, 7, 1.2); keyLight.position.set(0, 2.3, 1.1); g.add(keyLight);

  lockerEl.setObject3D('mesh', g);
  return { screen, domeRing, cavityLight, itemGlow, flash, comps };
}

const GAZE_GRACE = 1900;
const isGazeClick = e => !!(e && e.detail && e.detail.cursorEl && e.detail.cursorEl.id === 'gaze');
function animateScale(obj, to, dur, tween) {
  if (obj.userData.scaleTween) obj.userData.scaleTween.cancelled = true;
  const from = obj.scale.x;
  obj.userData.scaleTween = tween.add(dur, p => obj.scale.setScalar(from + (to - from) * p));
}

/** Elemento interactivo genérico (botones y tarjetas del catálogo). */
function createInteractive(parent, tween, { w, h, pos, px = 512, render, state = {}, onClick, onHover }) {
  const el = makeEntity(parent, { pos });
  const plane = createCanvasPlane(w, h, px);
  plane.mesh.renderOrder = 11;
  el.setObject3D('mesh', plane.mesh);
  const st = { hover: false, enabled: false, ...state };
  const draw = () => plane.draw((ctx, W, H) => render(ctx, W, H, st));
  draw();
  let last = 0;
  el.addEventListener('mouseenter', () => { if (!st.enabled) return; st.hover = true; draw(); animateScale(el.object3D, 1.05, 160, tween); onHover && onHover(true); });
  el.addEventListener('mouseleave', () => { const was = st.hover; st.hover = false; draw(); animateScale(el.object3D, 1, 160, tween); if (was && onHover) onHover(false); });
  el.addEventListener('click', e => {
    const now = performance.now();
    if (!st.enabled || now - last < 700) return;
    // La mirada no activa elementos que acaban de aparecer bajo el cursor (evita clics accidentales)
    if (isGazeClick(e) && now - st.enabledAt < GAZE_GRACE) return;
    last = now; Sound.unlock(); onClick();
  });
  return {
    el, mat: plane.mat, state: st,
    set(p) { Object.assign(st, p); draw(); },
    enable(on) { if (on && !st.enabled) st.enabledAt = performance.now(); st.enabled = on; el.classList.toggle('clickable', on); if (!on && st.hover) { st.hover = false; animateScale(el.object3D, 1, 160, tween); } draw(); }
  };
}

function createButton(parent, tween, { w = 0.44, h = 0.11, pos, label, variant = 'primary', onClick }) {
  return createInteractive(parent, tween, { w, h, pos, render: drawButton, state: { label, variant }, onClick });
}

/** Panel flotante con aparición/desaparición suave. `interactives` se habilitan al mostrarse. */
function createPanel(parent, tween, { w, h, pos, rot, draw, px = 1024 }) {
  const el = makeEntity(parent, { pos, rot, visible: false });
  const plane = createCanvasPlane(w, h, px);
  plane.mesh.renderOrder = 10;
  el.setObject3D('mesh', plane.mesh);
  if (draw) plane.draw(draw);
  const panel = {
    el, w, h, interactives: [], anim: null,
    canEnable: () => true,
    redraw(fn) { plane.draw(fn); },
    addButton(opts) { const b = createButton(el, tween, { ...opts, pos: [opts.x || 0, -h / 2 + 0.1, 0.006] }); this.interactives.push(b); return b; },
    show() {
      if (this.anim) this.anim.cancelled = true;
      el.setAttribute('visible', true);
      const mats = [plane.mat, ...this.interactives.map(i => i.mat)];
      this.anim = tween.add(420, p => { mats.forEach(m => (m.opacity = p)); el.object3D.scale.setScalar(0.94 + 0.06 * p); },
        { onDone: () => this.interactives.forEach(i => i.enable(this.canEnable(i) && !i.state.dim)) });
    },
    hide() {
      if (this.anim) this.anim.cancelled = true;
      this.interactives.forEach(i => i.enable(false));
      const mats = [plane.mat, ...this.interactives.map(i => i.mat)];
      this.anim = tween.add(300, p => { mats.forEach(m => (m.opacity = 1 - p)); el.object3D.scale.setScalar(1 - 0.04 * p); },
        { onDone: () => el.setAttribute('visible', false) });
    }
  };
  return panel;
}

/* ---------- 11. Mundo físico: colisiones y movimiento ---------- */
const World = {
  bounds: { minX: -9.6, maxX: 9.6, minZ: -10.6, maxZ: 7.6 },
  circles: [], boxes: [],
  addCircle(x, z, r) { this.circles.push({ x, z, r }); },
  addBox(cx, cz, w, d) { this.boxes.push({ minX: cx - w / 2, maxX: cx + w / 2, minZ: cz - d / 2, maxZ: cz + d / 2 }); },
  addBounds(minX, maxX, minZ, maxZ) { this.boxes.push({ minX, maxX, minZ, maxZ }); },
  /** Empuja un punto fuera de los obstáculos y lo mantiene dentro de la plaza. */
  resolve(p, r = 0.3) {
    for (let iter = 0; iter < 2; iter++) {
      for (const c of this.circles) {
        const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + r;
        if (d < m && d > 1e-6) { p.x = c.x + (dx / d) * m; p.z = c.z + (dz / d) * m; }
      }
      for (const b of this.boxes) {
        const qx = clamp(p.x, b.minX, b.maxX), qz = clamp(p.z, b.minZ, b.maxZ);
        const dx = p.x - qx, dz = p.z - qz, d = Math.hypot(dx, dz);
        if (d >= r) continue;
        if (d > 1e-6) { p.x = qx + (dx / d) * r; p.z = qz + (dz / d) * r; continue; }
        const opts = [[b.minX - r - p.x, 0], [b.maxX + r - p.x, 0], [0, b.minZ - r - p.z], [0, b.maxZ + r - p.z]];
        opts.sort((a, c) => Math.abs(a[0] + a[1]) - Math.abs(c[0] + c[1]));
        p.x += opts[0][0]; p.z += opts[0][1];
      }
    }
    p.x = clamp(p.x, this.bounds.minX + r, this.bounds.maxX - r);
    p.z = clamp(p.z, this.bounds.minZ + r, this.bounds.maxZ - r);
    return p;
  }
};

/**
 * Movimiento suave con el joystick del control (WebXR / Gamepad API) o con WASD / flechas.
 * La dirección es relativa a hacia dónde mira el usuario. Respeta las colisiones de World.
 */
AFRAME.registerComponent('locomotion', {
  schema: { speed: { default: 1.7 } },
  init() {
    this.keys = {}; this.suspendKeys = false; this.enabled = true; this.moving = false;
    this.fwd = new THREE.Vector3(); this.p = { x: 0, z: 0 };
    window.addEventListener('keydown', e => { if (!this.suspendKeys) this.keys[e.code] = true; });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => (this.keys = {}));
  },
  readStick() {
    let best = [0, 0];
    const consider = (ax, i) => {
      if (!ax || ax.length < i + 2) return;
      const x = ax[i], y = ax[i + 1];
      if (Math.hypot(x, y) > Math.hypot(best[0], best[1])) best = [x, y];
    };
    const xr = this.el.sceneEl.renderer && this.el.sceneEl.renderer.xr;
    const session = xr && xr.getSession && xr.getSession();
    if (session) {
      for (const src of session.inputSources) if (src.gamepad) { consider(src.gamepad.axes, 0); consider(src.gamepad.axes, 2); }
    } else if (navigator.getGamepads) {
      for (const gp of navigator.getGamepads()) if (gp) consider(gp.axes, 0);
    }
    return best;
  },
  tick(t, dt) {
    if (!dt) return;
    let [sx, sy] = this.readStick();
    const dead = 0.22, mag = Math.hypot(sx, sy);
    if (mag < dead) { sx = 0; sy = 0; } else { const k = (mag - dead) / (1 - dead) / mag; sx *= k; sy *= k; }
    if (!this.suspendKeys) {
      const K = this.keys;
      if (K.KeyW || K.ArrowUp) sy -= 1;
      if (K.KeyS || K.ArrowDown) sy += 1;
      if (K.KeyA || K.ArrowLeft) sx -= 1;
      if (K.KeyD || K.ArrowRight) sx += 1;
    }
    const m = Math.min(1, Math.hypot(sx, sy));
    this.moving = this.enabled && m > 0.05;
    if (!this.moving) return;
    const cam = this.el.sceneEl.camera;
    cam.getWorldDirection(this.fwd); this.fwd.y = 0;
    if (this.fwd.lengthSq() < 1e-4) this.fwd.set(0, 0, -1);
    this.fwd.normalize();
    const n = Math.hypot(sx, sy), step = (this.data.speed * m * Math.min(dt, 50)) / 1000;
    const fx = this.fwd.x, fz = this.fwd.z, rx = -fz, rz = fx;
    const mx = (fx * -sy + rx * sx) / n, mz = (fz * -sy + rz * sx) / n;
    const pos = this.el.object3D.position;
    this.p.x = pos.x + mx * step; this.p.z = pos.z + mz * step;
    World.resolve(this.p);
    pos.x = this.p.x; pos.z = this.p.z;
  }
});

/* ---------- 12. Teclado virtual (una sola textura para todas las teclas) ---------- */
const KB_ALPHA = [
  [...'QWERTYUIOP'], [...'ASDFGHJKLÑ'],
  [...'ZXCVBNM', { k: 'del', label: '⌫', u: 3 }],
  [{ k: 'space', label: 'Espacio', u: 7 }, { k: 'ok', label: 'Listo', u: 3, accent: true }]
];
const KB_NUM = [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9'], [{ k: 'del', label: '⌫' }, '0', { k: 'ok', label: 'OK', accent: true }]];

function createKeyboard(parent, { layout, keyW, keyH, gap, pos = [0, 0, 0], rot = [0, 0, 0], onKey, plate = true }) {
  const rows = layout.map(r => r.map(x => (typeof x === 'string' ? { k: x, label: x, u: 1 } : { u: 1, ...x })));
  const unitsMax = Math.max(...rows.map(r => r.reduce((a, b) => a + b.u, 0)));
  const totalW = unitsMax * keyW + (unitsMax - 1) * gap, totalH = rows.length * keyH + (rows.length - 1) * gap;
  const S = 1024 / totalW, canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = Math.ceil(totalH * S);
  const ctx = canvas.getContext('2d'), tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const root = makeEntity(parent, { pos, rot, visible: false });
  if (plate) {
    const bg = new THREE.Mesh(new THREE.PlaneGeometry(totalW + 0.04, totalH + 0.04), new THREE.MeshBasicMaterial({ color: '#120e1c', transparent: true, opacity: 0.94, depthWrite: false }));
    bg.position.z = -0.004; bg.renderOrder = 11; root.object3D.add(bg);
  }
  const keys = []; let last = 0, shownAt = 0;
  function drawKey(key) {
    const px = key.x * S, py = key.y * S, pw = key.w * S, ph = key.h * S;
    ctx.clearRect(px - 1, py - 1, pw + 2, ph + 2);
    roundRect(ctx, px + 2, py + 2, pw - 4, ph - 4, Math.min(18, ph * 0.22));
    ctx.fillStyle = key.flash ? BRAND.lavenderSoft
      : key.accent ? (key.hover ? BRAND.lavenderSoft : BRAND.lavender)
      : key.hover ? 'rgba(165,140,244,0.4)' : 'rgba(255,255,255,0.1)';
    ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(165,140,244,0.35)'; ctx.stroke();
    ctx.fillStyle = key.accent || key.flash ? BRAND.ink : BRAND.white;
    ctx.font = `600 ${Math.round(ph * (key.label.length > 2 ? 0.34 : 0.46))}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(key.label, px + pw / 2, py + ph / 2 + 2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    tex.needsUpdate = true;
  }
  rows.forEach((row, ri) => {
    const rowU = row.reduce((a, b) => a + b.u, 0);
    let x = (totalW - (rowU * keyW + (rowU - 1) * gap)) / 2;
    const y = ri * (keyH + gap);
    row.forEach(def => {
      const w = def.u * keyW + (def.u - 1) * gap;
      const key = { ...def, x, y, w, h: keyH, hover: false, flash: 0 };
      const geo = new THREE.PlaneGeometry(w, keyH);
      const u0 = x / totalW, u1 = (x + w) / totalW, v1 = 1 - y / totalH, v0 = 1 - (y + keyH) / totalH;
      geo.setAttribute('uv', new THREE.Float32BufferAttribute([u0, v1, u1, v1, u0, v0, u1, v0], 2));
      const mesh = new THREE.Mesh(geo, mat); mesh.renderOrder = 12;
      key.el = makeEntity(root, { pos: [x + w / 2 - totalW / 2, totalH / 2 - y - keyH / 2, 0] });
      key.el.setObject3D('mesh', mesh);
      key.el.addEventListener('mouseenter', () => { key.hover = true; drawKey(key); });
      key.el.addEventListener('mouseleave', () => { key.hover = false; drawKey(key); });
      key.el.addEventListener('click', e => {
        const n = performance.now(); if (n - last < 160) return;
        if (isGazeClick(e) && n - shownAt < GAZE_GRACE) return;
        last = n;
        Sound.unlock(); onKey(key.k);
        key.flash = 1; drawKey(key); setTimeout(() => { key.flash = 0; drawKey(key); }, 120);
      });
      keys.push(key); x += w + gap;
    });
  });
  keys.forEach(drawKey);
  return {
    el: root, width: totalW, height: totalH,
    visible: () => root.object3D.visible,
    show() { if (!root.object3D.visible) shownAt = performance.now(); root.setAttribute('visible', true); keys.forEach(k => k.el.classList.add('clickable')); },
    hide() { root.setAttribute('visible', false); keys.forEach(k => { k.el.classList.remove('clickable'); if (k.hover) { k.hover = false; drawKey(k); } }); }
  };
}

const MONUMENT = { x: 0, z: -34 };
const _e = new THREE.Euler(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
/** Matriz de transformación (posición, giro Y, escala, giro X/Z). Orden de rotación YXZ. */
function mtx(x, y, z, ry = 0, sx = 1, sy = 1, sz = 1, rx = 0, rz = 0) {
  _e.set(rx, ry, rz, 'YXZ'); _q.setFromEuler(_e);
  return new THREE.Matrix4().compose(_v.set(x, y, z), _q, _s.set(sx, sy, sz));
}

/** Agrupa muchas piezas estáticas en una sola malla (una sola llamada de dibujo). */
class Batch {
  constructor() { this.parts = []; }
  add(geo, matrix, color = '#ffffff', uvScale = null) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (matrix) g.applyMatrix4(matrix);
    const n = g.attributes.position.count, c = new THREE.Color(color), col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    if (uvScale && g.attributes.uv) {
      const uv = g.attributes.uv.array;
      for (let i = 0; i < uv.length; i += 2) { uv[i] *= uvScale[0]; uv[i + 1] *= uvScale[1]; }
    }
    this.parts.push(g);
    return this;
  }
  geometry() {
    let n = 0; for (const g of this.parts) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2), col = new Float32Array(n * 3);
    let o = 0;
    for (const g of this.parts) {
      const c = g.attributes.position.count;
      pos.set(g.attributes.position.array, o * 3);
      if (g.attributes.normal) nor.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
      col.set(g.attributes.color.array, o * 3);
      o += c; g.dispose();
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    out.computeBoundingSphere();
    this.parts = [];
    return out;
  }
  build(material) { return new THREE.Mesh(this.geometry(), material); }
}

function canvasTexture(w, h, draw, { repeat } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function texturedPlane(w, h, tex, { basic = true, side = THREE.FrontSide } = {}) {
  const mat = basic ? new THREE.MeshBasicMaterial({ map: tex, side }) : new THREE.MeshLambertMaterial({ map: tex, side });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
}

/** Construye todo el entorno estático y devuelve el sistema de vida urbana (autos, personas, dron). */
function buildCity(root) {
  const rand = seeded(20261013);
  const solid = new Batch(), glow = new Batch(), far = new Batch(), pools = new Batch();
  const facadeBatches = [new Batch(), new Batch(), new Batch()];
  const glowPoints = [];
  const M = MONUMENT, FLAT = -Math.PI / 2;
  const add = (geo, m, c) => solid.add(geo, m, c);

  /* Cielo de atardecer, sol sobre el volcán, nubes y primeras estrellas */
  const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -10; root.add(sky);
  const sunDir = new THREE.Vector3(-0.72, 0.035, -0.69).normalize();
  const sun = glowSprite('rgba(255,222,170,1)', 30); sun.material.fog = false; sun.position.copy(sunDir).multiplyScalar(280); root.add(sun);
  const halo = glowSprite('rgba(255,140,90,0.55)', 140); halo.material.fog = false; halo.position.copy(sun.position); root.add(halo);
  for (let i = 0; i < 7; i++) {
    const a = -2.6 + i * 0.55 + rand() * 0.3;
    const cl = glowSprite('rgba(255,170,190,0.28)', 1); cl.material.fog = false; cl.material.blending = THREE.NormalBlending;
    cl.scale.set(70 + rand() * 50, 9 + rand() * 6, 1);
    cl.position.set(Math.sin(a) * 260, 26 + rand() * 30, -Math.cos(a) * 260); root.add(cl);
  }
  const starPos = [];
  for (let i = 0; i < 260; i++) {
    const th = rand() * Math.PI * 2, ph = Math.acos(0.45 + rand() * 0.55), r = 280;
    starPos.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
  }
  const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  root.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, transparent: true, opacity: 0.55, fog: false, depthWrite: false })));

  /* Volcán de San Salvador (Boquerón y El Picacho) y cerros del horizonte */
  far.add(new THREE.CylinderGeometry(20, 95, 48, 28), mtx(-150, 24, -160), '#3b2b57');
  far.add(new THREE.ConeGeometry(55, 58, 24), mtx(-112, 29, -188), '#352750');
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + rand() * 0.2, d = 215 + rand() * 30, r = 60 + rand() * 50, h = 14 + rand() * 18;
    far.add(new THREE.ConeGeometry(r, h, 18), mtx(Math.sin(a) * d, h / 2, -Math.cos(a) * d), rand() < 0.5 ? '#3a2c52' : '#33284a');
  }

  /* Suelo, rotonda y calles */
  add(new THREE.PlaneGeometry(600, 600), mtx(0, -0.02, 0, 0, 1, 1, 1, FLAT), '#2a2631');
  add(new THREE.RingGeometry(9, 16.5, 72), mtx(M.x, 0.01, M.z, 0, 1, 1, 1, FLAT), '#302c37');
  add(new THREE.RingGeometry(12.68, 12.82, 72), mtx(M.x, 0.015, M.z, 0, 1, 1, 1, FLAT), '#cfc8b6');
  add(new THREE.RingGeometry(16.5, 18.6, 72), mtx(M.x, 0.02, M.z, 0, 1, 1, 1, FLAT), '#58525f');
  add(new THREE.CircleGeometry(9, 56), mtx(M.x, 0.02, M.z, 0, 1, 1, 1, FLAT), '#3e5b3c');
  add(new THREE.CircleGeometry(6.6, 56), mtx(M.x, 0.03, M.z, 0, 1, 1, 1, FLAT), '#9a9184');
  // Avenidas: poniente, oriente y norte, más la calle al sur de la plaza
  [[-57, 1], [57, 1]].forEach(([cx]) => add(new THREE.PlaneGeometry(80, 8), mtx(cx, 0.01, M.z, 0, 1, 1, 1, FLAT), '#302c37'));
  add(new THREE.PlaneGeometry(8, 80), mtx(0, 0.01, M.z - 56.5, 0, 1, 1, 1, FLAT), '#302c37');
  add(new THREE.PlaneGeometry(300, 6), mtx(0, 0.01, 12, 0, 1, 1, 1, FLAT), '#302c37');
  add(new THREE.PlaneGeometry(300, 1.2), mtx(0, 0.02, 8.6, 0, 1, 1, 1, FLAT), '#58525f');
  add(new THREE.PlaneGeometry(300, 2.4), mtx(0, 0.02, 16.2, 0, 1, 1, 1, FLAT), '#58525f');
  add(new THREE.BoxGeometry(300, 0.14, 0.2), mtx(0, 0.07, 9.1), '#6e6878');
  add(new THREE.BoxGeometry(300, 0.14, 0.2), mtx(0, 0.07, 15.0), '#6e6878');
  for (let x = -140; x < 140; x += 4) add(new THREE.PlaneGeometry(2, 0.14), mtx(x, 0.016, 12, 0, 1, 1, 1, FLAT), '#e6dfb8');
  for (let x = 18; x < 96; x += 4) {
    add(new THREE.PlaneGeometry(2, 0.14), mtx(x, 0.016, M.z, 0, 1, 1, 1, FLAT), '#e6dfb8');
    add(new THREE.PlaneGeometry(2, 0.14), mtx(-x, 0.016, M.z, 0, 1, 1, 1, FLAT), '#e6dfb8');
  }
  for (let z = M.z - 19; z > M.z - 95; z -= 4) add(new THREE.PlaneGeometry(0.14, 2), mtx(0, 0.016, z, 0, 1, 1, 1, FLAT), '#e6dfb8');
  add(new THREE.PlaneGeometry(26, 4.6), mtx(0, 0.015, -13.6, 0, 1, 1, 1, FLAT), '#3a5238');

  /* Plaza peatonal con adoquín y franja guía lavanda hacia el locker */
  const plaza = new THREE.Mesh(new THREE.PlaneGeometry(20, 19), new THREE.MeshLambertMaterial({ map: plazaTexture(rand) }));
  plaza.rotation.x = FLAT; plaza.position.set(0, 0.025, -1.5); root.add(plaza);
  const floorLogo = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.5), new THREE.MeshBasicMaterial({ map: canvasTexture(1024, 284, (x, w, h) => drawWordmark(x, w / 2, 0, h, null, 'center')), transparent: true, opacity: 0.55, depthWrite: false }));
  floorLogo.rotation.x = FLAT; floorLogo.position.set(0, 0.031, -1.55); root.add(floorLogo);
  for (let z = 1.2; z > -1.0; z -= 0.75) glow.add(new THREE.PlaneGeometry(0.08, 0.42), mtx(0, 0.03, z, 0, 1, 1, 1, FLAT), BRAND.lavender);
  // Barreras naturales: baranda al norte, jardineras a los lados, bolardos al sur
  for (let x = -10; x <= 10.01; x += 1.25) add(new THREE.BoxGeometry(0.06, 1.0, 0.06), mtx(x, 0.5, -11.1), '#5d566e');

    add(new THREE.BoxGeometry(0.5, 0.18, 18.9), mtx(x, 0.56, -1.5), '#3f5f42');
  });
  for (let x = -9.5; x <= 9.51; x += 1.5) add(new THREE.CylinderGeometry(0.09, 0.11, 0.8, 8), mtx(x, 0.4, 7.95), '#5d566e');

  /* Monumento al Divino Salvador del Mundo (estilizado) */
  const stone = '#d9d1c4';
  add(new THREE.CylinderGeometry(6.2, 6.4, 0.35, 40), mtx(M.x, 0.175, M.z), stone);
  add(new THREE.CylinderGeometry(5.4, 5.6, 0.35, 40), mtx(M.x, 0.525, M.z), stone);
  add(new THREE.CylinderGeometry(4.6, 4.8, 0.35, 40), mtx(M.x, 0.875, M.z), stone);
  add(new THREE.BoxGeometry(2.8, 4.6, 2.8), mtx(M.x, 3.35, M.z), '#cfc6b6');
  add(new THREE.BoxGeometry(3.2, 0.3, 3.2), mtx(M.x, 5.8, M.z), stone);
  add(new THREE.CylinderGeometry(0.75, 0.95, 13, 20), mtx(M.x, 12.45, M.z), '#e2dbcf');
  add(new THREE.CylinderGeometry(1.25, 0.85, 0.7, 20), mtx(M.x, 19.3, M.z), stone);
  add(new THREE.SphereGeometry(1.75, 24, 16), mtx(M.x, 21.4, M.z), '#7d93b8');
  const statue = [[0.55, 0], [0.5, 0.5], [0.4, 1.6], [0.32, 2.15], [0.48, 2.32], [0.22, 2.5], [0.17, 2.6], [0.21, 2.76], [0.17, 2.95], [0.001, 3.05]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  add(new THREE.LatheGeometry(statue, 20), mtx(M.x, 23.05, M.z), '#efe9df');
  [[2, 2], [-2, 2], [2, -2], [-2, -2]].forEach(([dx, dz]) => glowPoints.push([M.x + dx * 1.4, 1.3, M.z + dz * 1.4]));
  glowPoints.push([M.x, 21.4, M.z + 1.2]);

  /* Palmeras */
  const frond = new THREE.BoxGeometry(2.2, 0.05, 0.45).translate(1.1, 0, 0);
  function palm(x, z, h, lean = 0) {
    const tx = x - Math.sin(lean) * h, ty = Math.cos(lean) * h;
    add(new THREE.CylinderGeometry(0.13, 0.21, h, 7).translate(0, h / 2, 0), mtx(x, 0, z, 0, 1, 1, 1, 0, lean), '#6b5443');
    const n = 8, a0 = rand() * 6;
    for (let i = 0; i < n; i++) add(frond, mtx(tx, ty, z, a0 + (i / n) * Math.PI * 2, 1, 1, 1, 0, -0.35 - rand() * 0.35), i % 2 ? '#3f6b45' : '#4b7a4c');
    add(new THREE.SphereGeometry(0.28, 8, 6), mtx(tx, ty - 0.15, z), '#5a4630');
  }
  for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + 0.2; palm(M.x + Math.cos(a) * 7.8, M.z + Math.sin(a) * 7.8, 7 + rand() * 2, (rand() - 0.5) * 0.12); }
  [-8, -3, 2, 6.5].forEach(z => { palm(-10, z, 6 + rand() * 2, 0.06); palm(10, z, 6 + rand() * 2, -0.06); });
  for (let x = -66; x <= 66; x += 12) palm(x + rand() * 2, 16.6, 6.5 + rand() * 2, (rand() - 0.5) * 0.1);

  /* Edificios (cuadrícula urbana) con ventanas encendidas al atardecer */
  const facades = [facadeTexture(rand, '#3a3046'), facadeTexture(rand, '#2f2a3d'), facadeTexture(rand, '#433a4f')];
  const box = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  const billboards = [[24, -8], [-22, 26]];
  const blocked = (x, z, m) =>
    (x > -14 - m && x < 14 + m && z > -15 - m && z < 9 + m) ||
    (z > 7 - m && z < 18.5 + m) ||
    Math.hypot(x - M.x, z - M.z) < 25 + m ||
    (z > M.z - 6 - m && z < M.z + 6 + m && Math.abs(x) > 12) ||
    (Math.abs(x) < 6 + m && z < M.z - 12) ||
    billboards.some(([bx, bz]) => Math.hypot(x - bx, z - bz) < 9 + m);
  const placed = [];
  let tries = 0;
  while (placed.length < 70 && tries++ < 2000) {
    const x = (rand() * 2 - 1) * 95, z = -110 + rand() * 175;
    const w = 6 + rand() * 7, d = 6 + rand() * 7, m = Math.max(w, d) / 2;
    if (Math.hypot(x, z) < 26 || blocked(x, z, m)) continue;
    if (placed.some(p => Math.abs(p.x - x) < (p.w + w) / 2 + 1.5 && Math.abs(p.z - z) < (p.d + d) / 2 + 1.5)) continue;
    const dist = Math.hypot(x, z), tall = dist > 45 && rand() < 0.1;
    const h = tall ? 26 + rand() * 12 : 6 + rand() * (dist < 50 ? 10 : 16);
    placed.push({ x, z, w, d, h });
    facadeBatches[placed.length % 3].add(box, mtx(x, 0, z, 0, w, h, d), '#ffffff', [Math.max(1, Math.round(w / 6)), Math.max(1, Math.round(h / 12))]);
    add(new THREE.BoxGeometry(w * 0.3, 1.2, d * 0.25), mtx(x + w * 0.15, h + 0.6, z - d * 0.1), '#2a2433');
    if (tall) {
      glow.add(new THREE.BoxGeometry(w + 0.2, 0.35, d + 0.2), mtx(x, h - 0.6, z), BRAND.lavender);
      glow.add(new THREE.BoxGeometry(0.35, 0.35, 0.35), mtx(x, h + 1.5, z), '#ff3b4f');
    }
  }
  facadeBatches.forEach((b, i) => root.add(b.build(new THREE.MeshBasicMaterial({ map: facades[i] }))));

  /* Vallas publicitarias de Lendrop */
  billboards.forEach(([bx, bz], i) => {
    const yaw = Math.atan2(0 - bx, 0 - bz);
    add(new THREE.CylinderGeometry(0.25, 0.3, 11, 10), mtx(bx - Math.cos(yaw) * 4, 5.5, bz + Math.sin(yaw) * 4), '#3a3446');
    add(new THREE.CylinderGeometry(0.25, 0.3, 11, 10), mtx(bx + Math.cos(yaw) * 4, 5.5, bz - Math.sin(yaw) * 4), '#3a3446');
    add(new THREE.BoxGeometry(14.6, 6.6, 0.4), mtx(bx, 14, bz, yaw), '#1c1726');
    const board = texturedPlane(14, 6, canvasTexture(1024, 440, i === 0 ? drawBillboardRent : drawBillboardLend));
    board.position.set(bx + Math.sin(yaw) * 0.21, 14, bz + Math.cos(yaw) * 0.21); board.rotation.y = yaw; root.add(board);
  });

  /* Faroles (brillo falso: sin luces reales para mantener los FPS en los lentes) */
  const lamps = [[-3.2, -0.6], [3.2, -0.6], [-3.2, -4.8], [3.2, -4.8], [-9.2, -9.6], [9.2, -9.6], [-9.2, 6.9], [9.2, 6.9], [-3.4, 6.9], [3.4, 6.9]];
  lamps.forEach(([x, z]) => {
    const s = x > 0 ? -1 : 1;
    add(new THREE.CylinderGeometry(0.05, 0.07, 3.6, 8), mtx(x, 1.8, z), '#2e2938');
    add(new THREE.BoxGeometry(0.55, 0.05, 0.08), mtx(x + s * 0.24, 3.58, z), '#2e2938');
    glow.add(new THREE.BoxGeometry(0.36, 0.05, 0.16), mtx(x + s * 0.4, 3.53, z), '#ffe2b3');
    glowPoints.push([x + s * 0.4, 3.45, z]);
    pools.add(new THREE.PlaneGeometry(3, 3), mtx(x + s * 0.4, 0.035, z, 0, 1, 1, 1, FLAT));
    World.addCircle(x, z, 0.12);
  });

  /* Bancas */
  const bench = (x, z, yaw) => {
    const B = mtx(x, 0, z, yaw), at = (gx, gy, gz) => B.clone().multiply(mtx(gx, gy, gz));
    add(new THREE.BoxGeometry(1.8, 0.07, 0.46), at(0, 0.46, 0), '#7a5a44');
    add(new THREE.BoxGeometry(1.8, 0.4, 0.06), at(0, 0.72, -0.22), '#7a5a44');
    [-0.75, 0.75].forEach(lx => add(new THREE.BoxGeometry(0.08, 0.46, 0.42), at(lx, 0.23, 0), '#2e2938'));

  [[-1.3, 0.85], [1.3, 0.85], [-1.3, -0.45], [1.3, -0.45]].forEach(([x, z]) => add(new THREE.CylinderGeometry(0.05, 0.05, 2.5, 8), kat(x, 1.25, z), '#6b4a36'));
  add(new THREE.BoxGeometry(3.0, 0.12, 1.8), kat(0, 2.56, 0.2), '#7a3e2a');

  const flag = new THREE.Mesh(flagGeo, new THREE.MeshBasicMaterial({ map: canvasTexture(256, 152, drawFlag), side: THREE.DoubleSide }));
  flag.position.set(flagPos[0], 9.1, flagPos[1]); root.add(flag);
  const flagBase = flagGeo.attributes.position.array.slice();
  World.addCircle(flagPos[0], flagPos[1], 0.2);

  /* Materiales de los lotes */
  root.add(solid.build(new THREE.MeshLambertMaterial({ vertexColors: true })));

  const life = buildCityLife(root, rand);

    update(t, dt) {
      life.update(t, dt);
      const pos = flagGeo.attributes.position.array, s = t / 1000;
      for (let i = 0; i < pos.length; i += 3) {
        const x = flagBase[i], k = x / 2.7;
        pos[i + 2] = flagBase[i + 2] + Math.sin(x * 2.4 - s * 3.2) * 0.13 * k;
        pos[i + 1] = flagBase[i + 1] - k * 0.08;
      }
      flagGeo.attributes.position.needsUpdate = true;
    }
  };
}

/** Tráfico en la rotonda y la calle, peatones y un dron de reparto Lendrop. */
function buildCityLife(root, rand) {
  const dummy = new THREE.Object3D(), M = MONUMENT;
  const inst = (geo, mat, n) => { const m = new THREE.InstancedMesh(geo, mat, n); m.frustumCulled = false; root.add(m); return m; };

  // Autos
  const cars = [];
  for (let i = 0; i < 12; i++) cars.push({ ring: true, r: i % 2 ? 11.2 : 14.1, a: (i / 12) * Math.PI * 2 + (i % 2) * 0.3, v: 7 + (i % 4) * 1.3 });
  for (let i = 0; i < 8; i++) cars.push({ ring: false, z: i % 2 ? 13.4 : 10.6, dir: i % 2 ? -1 : 1, x: -130 + i * 33, v: 9 + (i % 3) * 2 });
  const N = cars.length;
  const lights = (z, w) => new Batch().add(new THREE.BoxGeometry(0.36, 0.14, 0.04), mtx(-0.6, 0.66, z)).add(new THREE.BoxGeometry(0.36, 0.14, 0.04), mtx(0.6, 0.66, z)).geometry();
  const bodies = inst(new THREE.BoxGeometry(1.8, 0.62, 4.2).translate(0, 0.55, 0), new THREE.MeshLambertMaterial(), N);
  const cabins = inst(new THREE.BoxGeometry(1.6, 0.55, 2.1).translate(0, 1.13, 0.25), new THREE.MeshLambertMaterial({ color: '#1d1a26' }), N);
  const heads = inst(lights(-2.11), new THREE.MeshBasicMaterial({ color: '#fff3d1' }), N);
  const tails = inst(lights(2.11), new THREE.MeshBasicMaterial({ color: '#ff2e4d' }), N);
  const CAR_COLORS = ['#e8e6ef', '#b3262f', '#1c1b22', '#2f5aa8', '#9aa0a8', '#d9d4c7', '#5a2a7a', '#c9a227', '#3d6b4f', '#f0f0f0', '#7a1f2b', '#2a2f3a'];
  cars.forEach((c, i) => bodies.setColorAt(i, new THREE.Color(CAR_COLORS[i % CAR_COLORS.length])));

  // Buses urbanos
  const buses = [{ ring: true, r: 14.1, a: 2.2, v: 6.5 }, { ring: false, z: 10.6, dir: 1, x: 10, v: 8 }, { ring: false, z: 13.4, dir: -1, x: -60, v: 8 }];
  const busMesh = inst(new THREE.BoxGeometry(2.5, 2.9, 10.5).translate(0, 1.75, 0), new THREE.MeshLambertMaterial({ map: canvasTexture(512, 256, drawBusTexture) }), buses.length);

  // Peatones
  const RECT = { minX: -8.0, maxX: 8.0, minZ: -9.8, maxZ: 6.0 };
  const per = 2 * (RECT.maxX - RECT.minX + RECT.maxZ - RECT.minZ);
  const peds = [];
  for (let i = 0; i < 8; i++) peds.push({ path: 'rect', s: (i / 8) * per + rand() * 3, dir: i % 2 ? 1 : -1, v: 0.9 + rand() * 0.5 });
  for (let i = 0; i < 4; i++) peds.push({ path: 'island', a: (i / 4) * Math.PI * 2, dir: i % 2 ? 1 : -1, v: 0.8 + rand() * 0.4 });
  for (let i = 0; i < 4; i++) peds.push({ path: 'south', x: -40 + i * 22, dir: i % 2 ? 1 : -1, v: 1 + rand() * 0.4 });
  const P = peds.length;
  const torsos = inst(new THREE.CylinderGeometry(0.17, 0.22, 0.72, 8).translate(0, 1.13, 0), new THREE.MeshLambertMaterial(), P);
  const legs = inst(new THREE.CylinderGeometry(0.16, 0.12, 0.78, 8).translate(0, 0.39, 0), new THREE.MeshLambertMaterial(), P);
  const headsP = inst(new THREE.SphereGeometry(0.12, 10, 8).translate(0, 1.64, 0), new THREE.MeshLambertMaterial(), P);
  const SHIRTS = ['#e85d75', '#3f7cc4', '#f2c14e', '#5bb07a', '#a58cf4', '#ffffff', '#e07a4f', '#2f2f3a'];
  const SKIN = ['#8d5a3b', '#b07a55', '#c99673', '#6e452c', '#d8ad8a'];
  peds.forEach((p, i) => {
    torsos.setColorAt(i, new THREE.Color(SHIRTS[i % SHIRTS.length]));
    legs.setColorAt(i, new THREE.Color(i % 3 ? '#2d3a55' : '#2a2833'));
    headsP.setColorAt(i, new THREE.Color(SKIN[i % SKIN.length]));
  });
  function rectPos(s) {
    const w = RECT.maxX - RECT.minX, h = RECT.maxZ - RECT.minZ;
    s = ((s % per) + per) % per;
    if (s < w) return [RECT.minX + s, RECT.minZ, 1, 0];
    s -= w; if (s < h) return [RECT.maxX, RECT.minZ + s, 0, 1];
    s -= h; if (s < w) return [RECT.maxX - s, RECT.maxZ, -1, 0];
    s -= w; return [RECT.minX, RECT.maxZ - s, 0, -1];
  }

  // Dron de reparto Lendrop
  const drone = new THREE.Group();
  const dm = buildItemModel('drone', 0.4); dm.scale.setScalar(7); drone.add(dm);
  const cargoTex = canvasTexture(256, 256, (x, w, h) => { x.fillStyle = BRAND.purple; x.fillRect(0, 0, w, h); drawLogo(x, 38, 38, 180); });
  const cargo = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.34, 0.42), new THREE.MeshLambertMaterial({ map: cargoTex }));
  cargo.position.y = -0.1; drone.add(cargo);
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), new THREE.MeshBasicMaterial({ color: BRAND.lavender }));
  led.position.set(0, 0.62, 0); drone.add(led);
  root.add(drone);

  const place = (mesh, i) => { mesh.setMatrixAt(i, dummy.matrix); };
  const vehicle = (c, sec) => {
    let x, z, dx, dz;
    if (c.ring) { c.a += (c.v / c.r) * sec; x = M.x + c.r * Math.cos(c.a); z = M.z + c.r * Math.sin(c.a); dx = -Math.sin(c.a); dz = Math.cos(c.a); }
    else { c.x += c.dir * c.v * sec; if (c.x > 140) c.x = -140; if (c.x < -140) c.x = 140; x = c.x; z = c.z; dx = c.dir; dz = 0; }
    dummy.position.set(x, 0, z); dummy.rotation.set(0, Math.atan2(-dx, -dz), 0); dummy.updateMatrix();
  };

  return {
    update(t, dt) {
      const sec = Math.min(dt || 16, 50) / 1000;
      cars.forEach((c, i) => { vehicle(c, sec); place(bodies, i); place(cabins, i); place(heads, i); place(tails, i); });
      [bodies, cabins, heads, tails].forEach(m => (m.instanceMatrix.needsUpdate = true));
      buses.forEach((b, i) => { vehicle(b, sec); place(busMesh, i); });
      busMesh.instanceMatrix.needsUpdate = true;
      peds.forEach((p, i) => {
        let x, z, dx, dz;
        if (p.path === 'rect') { p.s += p.dir * p.v * sec; [x, z, dx, dz] = rectPos(p.s); dx *= p.dir; dz *= p.dir; }
        else if (p.path === 'island') { p.a += (p.dir * p.v * sec) / 7.2; x = M.x + 7.2 * Math.cos(p.a); z = M.z + 7.2 * Math.sin(p.a); dx = -Math.sin(p.a) * p.dir; dz = Math.cos(p.a) * p.dir; }
        else { p.x += p.dir * p.v * sec; if (Math.abs(p.x) > 70) p.dir *= -1; x = p.x; z = 16.6; dx = p.dir; dz = 0; }
        const bob = Math.abs(Math.sin(t * 0.006 * p.v + i)) * 0.045;
        dummy.position.set(x, bob, z); dummy.rotation.set(0, Math.atan2(dx, dz), 0); dummy.updateMatrix();
        place(torsos, i); place(legs, i); place(headsP, i);
      });
      [torsos, legs, headsP].forEach(m => (m.instanceMatrix.needsUpdate = true));
      const s = t / 1000, a = s * 0.22;
      drone.position.set(Math.cos(a) * 9, 10.5 + Math.sin(s * 0.8) * 0.4, -4 + Math.sin(a) * 6);
      drone.rotation.y = -a; drone.rotation.z = Math.sin(s * 0.8) * 0.04;
      led.visible = Math.sin(s * 6) > 0;
    }
  };
}

    const camObj = this.camEl.object3D;
